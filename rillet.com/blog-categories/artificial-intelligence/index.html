<style>
  /* Prevents horizontal scrolling */
  body {
    overflow-x: hidden;
  }

  /* Style the selected text color and background */
  ::selection {
    background: #000000;
    color: #FFFFFF;
    text-shadow: none;
  }

  /* Body no scroll on Menu and Modal open - (the class "o.hidden" will be toggled from the global script) */
  .o-hidden {
    overflow: hidden !important;
  }

  .nav__links-wrapper.is--open { /* This must be the class of the menu links wrapper. It must be 100vh */
    overflow-y: auto !important;
    overflow-x: hidden !important;
  }

  /* Show/hide nav on scroll up/down */
  .navigation {
    transform: translateY(0%);
    transition: transform 0.5s var(--ease-cubic);
  }

  [data-scrolling-started="true"][data-scrolling-direction="down"] .navigation {
    transform: translateY(-100%);
    transition: transform 0.5s var(--ease-cubic);
  }

  /*Swiper JS*/
  .swiper-next.is-disabled, .swiper-prev.is-disabled{
    opacity: 0.5;
    pointer-events: none !important;
  }

  /* CTA slider */
  .swiper-cards {
    overflow: visible;
  }

  .swiper-cards .swiper-slide {
    transform-origin: center bottom;
    -webkit-backface-visibility: hidden;
    backface-visibility: hidden;
    overflow: hidden;
  }

  .swiper-3d.swiper-css-mode .swiper-wrapper {
    perspective: 800rem;
  }

  .swiper-3d .swiper-wrapper {
    transform-style: preserve-3d;
  }

  .swiper-3d {
    perspective: 800rem;
  }

  .swiper-3d .swiper-cube-shadow,
  .swiper-3d .swiper-slide {
    transform-style: preserve-3d;
  }

  .swiper-3d .swiper-slide-shadow {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 10;
    background: rgba(0, 0, 0, .15);
  }

  /* Modal - See it in action */
  .modal__btn {
    pointer-events: all;
  }

  .modal__wrapper {
    pointer-events: none;
    display: flex !important;
    position: fixed !important;
    visibility: hidden !important;
    opacity: 0 !important;
    transition: visibility 0.3s ease, opacity 0.3s ease;
  }

  .modal__wrapper.is--open {
    pointer-events: all;
    visibility: visible !important;
    opacity: 1 !important;
    transition: visibility 0.3s ease, opacity 0.3s ease;
  }

  .modal__wrapper .modal__video-width,
  .modal__wrapper-testimonials .modal__video-width {
    transform: translateY(40px);
    transition: transform var(--dur-out) var(--ease-cubic);
  }

  .modal__wrapper.is--open .modal__video-width,
  .modal__wrapper-testimonials.is--open .modal__video-width {
    transform: translateY(0px);
    transition: transform var(--dur-in) var(--ease-cubic);
  }

  .filters__tags::-webkit-scrollbar {
    display: none;
  }

  /* Testimonials */
  .testimonials__col-item-new.no-transition * {
    transition: none !important;
  }

  @media only screen and (min-width: 991px) {
    .testimonials__col-item-new.force-active:first-of-type {
      flex: 0 0.1 auto;
      width: 68%;
    }
  }

  .testimonials__modal-btn {
    pointer-events: all;
  }

  .modal__wrapper-testimonials {
    pointer-events: none;
    display: flex !important;
    position: fixed !important;
    visibility: hidden !important;
    opacity: 0 !important;
    transition:
      visibility 0.3s ease,
      opacity 0.3s ease;
  }

  .modal__wrapper-testimonials.is--open {
    pointer-events: all;
    visibility: visible !important;
    opacity: 1 !important;
    transition:
      visibility 0.3s ease,
      opacity 0.3s ease;
  }

  .w-editor .testimonials__col-item-new .p-leading,
  .w-editor .testimonials__col-item-new .testimonials__bottom-info,
  .w-editor .testimonials__col-item-new .testimonials__logo,
  .w-editor .testimonials__col-item-new .testimonials__visual-height .img-full {
    opacity: 1;
    transform: translate(0 0 0);
    transform: scale(1);
  }


  /* Default - Scheduling modal */
  .dftDefaultLoadingModal * {
    opacity: 0 !important;
    visibility: hidden !important;
    pointer-events: none !important;
  }

</style>

<!-- GSAP -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.7/dist/CustomEase.min.js"></script>



<script>
  gsap.registerPlugin(ScrollTrigger, CustomEase);


  // All functions
  window.addEventListener("DOMContentLoaded", function() {

    // desktop
    gsap.matchMedia().add("(min-width: 992px)", () => {
      //testimonialsDesktop();
    })

    // mobile
    gsap.matchMedia().add("(max-width: 992px)", () => {
      //testimonialsMobile();
    })

    // global
    initGlobalVideoModalTestimonials();
    initDetectScrollingDirection();
    toggleMenu();
    seeItInActionVideo();
    playMarquee();

  });


  // Custom ease
  CustomEase.create("customEase", "M0,0 C0.77,0 0.175,1 1,1");


  /* ===========================
   Testimonials responsive
=========================== */

  let testimonialsSwiper = null;
  let testimonialsResizeTimer;

  const testimonialsDesktopMQ = window.matchMedia('(min-width: 992px)');

  function destroyTestimonialsDesktop() {
    const videoContainers = $('.testimonials__col-item-new');

    videoContainers.off('mouseenter.testimonialsDesktop');
    videoContainers.removeClass('active force-active no-transition');

    videoContainers.each(function () {
      const video = $(this).find('video').get(0);
      if (video) video.pause();
    });
  }

  function initTestimonialsDesktop() {
    const videoContainers = $('.testimonials__col-item-new');
    if (!videoContainers.length) return;

    destroyTestimonialsDesktop();

    const firstItem = videoContainers.eq(0);

    firstItem.addClass('no-transition active');
    firstItem[0].offsetHeight;
    firstItem.removeClass('no-transition');

    const defaultVideo = firstItem.find('video').get(0);
    if (defaultVideo) defaultVideo.play();

    videoContainers.on('mouseenter.testimonialsDesktop', function () {
      videoContainers.removeClass('active');

      videoContainers.each(function () {
        const video = $(this).find('video').get(0);
        if (video) video.pause();
      });

      $(this).addClass('active');

      const video = $(this).find('video').get(0);
      if (video) video.play();
    });
  }

  function destroyTestimonialsMobile() {
    if (!testimonialsSwiper) return;

    testimonialsSwiper.destroy(true, true);
    testimonialsSwiper = null;
  }

  function initTestimonialsMobile() {
    if (testimonialsSwiper) return;

    const swiperEl = document.querySelector('.swiper__testimonials');
    if (!swiperEl) return;

    testimonialsSwiper = new Swiper('.swiper__testimonials', {
      centeredSlides: false,
      loop: false,
      speed: 700,
      keyboard: true,
      draggable: true,
      slidesPerView: 1,
      spaceBetween: 16,
      observer: true,
      observeParents: true,
      navigation: {
        nextEl: '.swiper-next.is--testimonials',
        prevEl: '.swiper-prev.is--testimonials',
        disabledClass: 'is-disabled',
      },
    });

    requestAnimationFrame(() => {
      testimonialsSwiper?.update();
    });
  }

  function updateTestimonialsMode() {
    if (testimonialsDesktopMQ.matches) {
      destroyTestimonialsMobile();
      initTestimonialsDesktop();
    } else {
      destroyTestimonialsDesktop();
      initTestimonialsMobile();
    }
  }

  function refreshTestimonials() {
    clearTimeout(testimonialsResizeTimer);

    testimonialsResizeTimer = setTimeout(() => {
      updateTestimonialsMode();
      testimonialsSwiper?.update();
    }, 200);
  }

  document.addEventListener('DOMContentLoaded', updateTestimonialsMode);
  window.addEventListener('load', updateTestimonialsMode);
  window.addEventListener('resize', refreshTestimonials);
  testimonialsDesktopMQ.addEventListener('change', updateTestimonialsMode);

  // Testimonials MODAL
  function initGlobalVideoModalTestimonials() {
    const modal = document.querySelector('.modal__wrapper-testimonials');

    // Prevent error if modal does not exist
    if (!modal) return;

    const video = modal.querySelector('.video-frame'); // this is <video>, not iframe
    const closeArea = modal.querySelector('.modal__close-area');
    const closeBtn = modal.querySelector('.modal__close-btn');
    const body = document.querySelector('body');

    if (!modal || !video) return;

    const stopVideo = () => {
      video.pause();
      video.removeAttribute('src');
      video.load(); // unloads buffer properly
    };

    document.querySelectorAll('.testimonials__modal-btn').forEach((videoTrigger) => {
      videoTrigger.addEventListener('click', () => {
        const slide = videoTrigger.closest('.testimonials__col-item-new');
        if (!slide) return;

        const videoSrc = slide.getAttribute('data-video-src');
        if (!videoSrc) return;

        modal.classList.add('is--open');
        body.classList.add('o-hidden');

        video.setAttribute('muted', '');
        video.setAttribute('playsinline', '');
        video.src = videoSrc;
        video.load();

        // let layout paint, then force play
        requestAnimationFrame(() => {
          video.play().catch(() => {
            setTimeout(() => video.play().catch(() => {}), 50);
          });
        });
      });
    });

    const closeModal = () => {
      modal.classList.remove('is--open');
      body.classList.remove('o-hidden');
      stopVideo();
    };

    closeArea?.addEventListener('click', closeModal);
    closeBtn?.addEventListener('click', closeModal);
  }

  let isFirstTap = true;

  document.addEventListener(
    'touchstart',
    () => {
      if (!isFirstTap) return;
      const video = document.querySelector('.video-frame');
      if (!video) return;

      video.muted = false;
      isFirstTap = false;
    },
    { once: true },
  );


  // See it in action MODAL
  function seeItInActionVideo() {
    document.addEventListener("click", function(e) {
      const isVideoIcon = e.target.closest(".modal__btn");
      const isPopup = e.target.closest(".modal__close-area");
      const isCloseBtn = e.target.closest(".modal__close-btn");

      const modal = document.querySelector(".modal__wrapper");
      const body = document.body;

      if (!modal) return;

      const video = modal.querySelector("video");
      const source = video?.querySelector("source");

      const stopAndMuteVideo = (vid) => {
        if (vid) {
          vid.pause();
          vid.currentTime = 0;
          vid.muted = true;

          // unload video
          if (source) {
            source.removeAttribute("src");
            vid.load();
          }
        }
      };

      if (isVideoIcon) {
        modal.classList.add("is--open");
        body.classList.add("o-hidden");

        if (video && source) {

          // add src only when modal opens
          if (!source.getAttribute("src")) {
            source.setAttribute("src", source.dataset.src);
            video.load();
          }

          video.muted = false;

          video.play().catch(err => {
            console.warn("Autoplay blocked:", err);
          });
        }
      }

      if (isPopup || isCloseBtn) {
        stopAndMuteVideo(video);

        modal.classList.remove("is--open");
        body.classList.remove("o-hidden");
      }
    });
  }


  // Body no scroll on Menu open
  function toggleMenu(){
    const body = $('body');
    const menu = $('.hamburger__menu');
    const menuLinks = $('.nav__links-wrapper');

    menu.on("click", function(){
      body.toggleClass("o-hidden");
      menuLinks.toggleClass("is--open");
    })
  }


  // Play lotties
  const loadLottie = () => {
    if (window.lottie) return Promise.resolve();
    return new Promise(resolve => {
      const script = document.createElement('script');
      script.src = 'https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.10.2/lottie.min.js';
      script.onload = resolve;
      document.body.appendChild(script);
    });
  };

  const observer = new IntersectionObserver((entries, obs) => {
    entries.forEach(async entry => {
      if (!entry.isIntersecting) return;

      const container = entry.target;
      const src = container.getAttribute('data-src');

      await loadLottie();

      window.lottie.loadAnimation({
        container,
        renderer: 'svg',
        loop: container.getAttribute('data-loop') === 'true',
        autoplay: true,
        path: src
      });

      obs.unobserve(container);
    });
  });

  document.addEventListener('DOMContentLoaded', () => {
    document.querySelectorAll('.lottie-video').forEach(el => observer.observe(el));
  });



  // Detect scrolling up/down
  function initDetectScrollingDirection() {
    let lastScrollTop = 0;
    const threshold = 10; // Minimal scroll distance to switch to up/down 
    const thresholdTop = 50; // Minimal scroll distance from top of window to start

    window.addEventListener('scroll', () => {
      const nowScrollTop = window.scrollY;

      if (Math.abs(lastScrollTop - nowScrollTop) >= threshold) {
        // Update Scroll Direction
        const direction = nowScrollTop > lastScrollTop ? 'down' : 'up';
        document.querySelectorAll('[data-scrolling-direction]').forEach(el => 
                                                                        el.setAttribute('data-scrolling-direction', direction)
                                                                       );

        // Update Scroll Started
        const started = nowScrollTop > thresholdTop;
        document.querySelectorAll('[data-scrolling-started]').forEach(el => 
                                                                      el.setAttribute('data-scrolling-started', started ? 'true' : 'false')
                                                                     );
        lastScrollTop = nowScrollTop;
      }
    });
  }


  // CMS trick for solution links in nav and footer
  $(".tr-item").each(function (index) {
    let cmsItem = $(this);
    let itemCategory = cmsItem.find(".tr-category").text();
    $(".tr-contain").each(function (index) {
      let groupCategory = $(this).find(".tr-title").text();
      if (groupCategory === itemCategory) {
        cmsItem.appendTo($(this).find(".tr-list"));
      }
    });
  });

  $(".tr-item-nav").each(function (index) {
    let cmsItem = $(this);
    let itemCategory = cmsItem.find(".tr-category-nav").text();
    $(".tr-contain-nav").each(function (index) {
      let groupCategory = $(this).find(".tr-title-nav").text();
      if (groupCategory === itemCategory) {
        cmsItem.appendTo($(this).find(".tr-list-nav"));
      }
    });
  });


  // Play marquee
  function playMarquee() {
    gsap.utils.toArray(".marquee__container").forEach(container => {
      ScrollTrigger.create({
        trigger: container,
        start: "top bottom",
        end: "bottom top",
        onEnter: () => container.style.animationPlayState = "running",
        onLeave: () => container.style.animationPlayState = "paused",
        onEnterBack: () => container.style.animationPlayState = "running",
        onLeaveBack: () => container.style.animationPlayState = "paused",
      });
    });
  }

  // ---------------- LAZY LOAD ----------------
  const observerImgVideo = new IntersectionObserver((entries, obs) => {
    entries.forEach(entry => {
      if (!entry.isIntersecting) return;
      const el = entry.target;
      if (el.tagName.toLowerCase() === 'img' && el.classList.contains('lazy-image')) {
        const imgSrc = el.getAttribute('data-src');
        if (imgSrc && el.src !== imgSrc) el.src = imgSrc;
        obs.unobserve(el);
        return;
      }

      if (el.tagName.toLowerCase() === 'video' && el.classList.contains('lazy-video')) {
        const video = el;
        const src = video.getAttribute('data-src');
        const shouldAutoplay = video.getAttribute('data-autoplay') === 'true';

        if (src && !video.src) {
          video.src = src;
          video.load();
        }
        if (shouldAutoplay) {
          if (video.readyState >= 2) video.play().catch(() => {});
          else video.addEventListener('loadedmetadata', () => video.play().catch(() => {}), { once: true });
        }
        obs.unobserve(video);
      }
    });
  }, { rootMargin: "200px 0px", threshold: 0 });

  document.querySelectorAll('.lazy-video').forEach(v => observerImgVideo.observe(v));
  document.querySelectorAll('.lazy-image').forEach(img => observerImgVideo.observe(img));

  function observeLazyIn(root = document) {
    root.querySelectorAll('img.lazy-image:not([data-io])').forEach(el => {
      observer.observe(el);
      el.dataset.io = '1';
    });
    root.querySelectorAll('video.lazy-video:not([data-io])').forEach(el => {
      observer.observe(el);
      el.dataset.io = '1';
    });
  }

  // Set Footer Copyright Year
  Webflow.push(function() {
    $('.copyright-year').text(new Date().getFullYear());
  });

</script>

<script>
(function () {
  if (!navigator.modelContext?.registerTool) return;
  const ac = new AbortController();

  navigator.modelContext.registerTool(
    {
      name: "get_api_info",
      description: "Returns Rillet API base URLs, OpenAPI spec location, and authentication method.",
      inputSchema: { type: "object", properties: {} }
    },
    {
      signal: ac.signal,
      execute: async () => ({
        production: "https://api.rillet.com",
        sandbox: "https://sandbox.api.rillet.com",
        openapi_spec: "https://docs.api.rillet.com/openapi.json",
        documentation: "https://docs.api.rillet.com",
        authentication: "Bearer token via Authorization header",
        mcp_endpoint: "https://api.rillet.com/mcp"
      })
    }
  );

  navigator.modelContext.registerTool(
    {
      name: "navigate_to_page",
      description: "Navigate to a key Rillet page: home, pricing, integrations, demo, docs, blog, about, careers.",
      inputSchema: {
        type: "object",
        properties: {
          page: {
            type: "string",
            enum: ["home","pricing","integrations","demo","docs","blog","about","careers"]
          }
        },
        required: ["page"]
      }
    },
    {
      signal: ac.signal,
      execute({ page }) {
        const routes = {
          home: "/", pricing: "/pricing", integrations: "/integrations",
          demo: "/demo", docs: "https://docs.api.rillet.com",
          blog: "/blog", about: "/about", careers: "/careers"
        };
        const path = routes[page];
        if (!path) return { error: "Unknown page: " + page };
        if (path.startsWith("http")) { window.open(path, "_blank"); }
        else { window.location.href = path; }
        return { navigated: true, page, path };
      }
    }
  );
})();
