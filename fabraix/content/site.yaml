approach:
  title: "Our Approach"
  statements:
    - label: "What's broken"
      body: "AI agents break in ways traditional software doesn't. And since agents are non-deterministic, the same input can pass one run and fail the next. Vulnerabilities surface in those gaps, and attackers exploit these edge cases. So fixing one doesn't mean you're protected from the next."
    - label: "How we solve"
      body: "Our offensive harness pushes your system to its breaking point across security, logic, and alignment. Pure blackbox, no integration needed. You can't verify what you haven't tried to break."
    - label: "Why it matters"
      body: "The path to safe superintelligence runs through offensive AI. Every failure surfaced is intelligence we didn't have yesterday. A new failure mode found leads to a new guardrail trained. The faster we break AI, the faster AI gets safe enough to trust."

