<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://api.fontshare.com; font-src https://fonts.gstatic.com https://cdn.fontshare.com; img-src 'self' data:; connect-src 'self' http://127.0.0.1:3001 http://localhost:3001 http://127.0.0.1:4801 http://127.0.0.1:54321 http://127.0.0.1:54322 https://coljlubmewcpgjzqapyl.supabase.co https://conifer-billing-production.up.railway.app https://conifer-gateway-production.up.railway.app; base-uri 'none'; form-action 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>conifer console · heartwood</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=Spline+Sans+Mono:ital,wght@0,400..600;1,400..500&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#161413; --panel:#1E1B18; --raise:#242019; --line:#332D26; --line2:#2A251F;
  --ink:#F1EBE1; --sec:#BFAF9C; --dim:#9C8F7B; --faint:#786D5C;
  --grid:rgba(240,230,215,.07);
  --loc:#6FA57C; --cld:#C9A98A; --vio:#8B7EC8;
  --up:#7FB069; --dn:#D08770;
  --m-qwen14:#7FB069; --m-llama8:#A3C585; --m-qwen4:#5E8C61;
  --m-fable:#D08770; --m-sonnet:#E3A587; --m-gpt:#6FC2B4; --m-kimi:#D68FB8;
  --m-dsk:#7A9CD6; --m-glm:#9B8CD9; --m-mistral:#E8B268;
  --sans:'Instrument Sans',sans-serif; --mono:'Spline Sans Mono',ui-monospace,monospace;
  --focus:#D2A75C; --gold:#D2A75C;
}
*{margin:0;padding:0;box-sizing:border-box}
html{background:var(--ground)}
body{background-color:var(--ground);color:var(--ink);font-family:var(--sans);font-size:12.5px;line-height:1.5;
  -webkit-font-smoothing:antialiased;min-height:100vh;
  background-image:radial-gradient(rgba(241,235,225,.03) 1px,transparent 1.1px);
  background-size:22px 22px}
::selection{background:rgba(201,169,138,.32)}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg{display:block}
.mono,.readout{font-family:var(--mono);font-variant-numeric:tabular-nums}
.shell{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}

/* ---------------- sidebar ---------------- */
.rail{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:20px 14px 14px;
  background:#1A1815;border-right:1px solid var(--line2)}
.brand{display:flex;align-items:center;gap:11px;padding:0 6px 16px}
.brand .mark{color:#E0D8C8;flex:none}
.brand .bar{width:1px;height:30px;background:var(--line);flex:none}
.brand .word{font-weight:600;font-size:18px;letter-spacing:-.02em;line-height:1}
.brand .word small{display:block;font-family:var(--mono);font-weight:400;font-size:9px;letter-spacing:.2em;color:var(--dim);margin-top:4px}
.proj{display:flex;align-items:center;gap:5px;margin:0 4px 30px;padding:7px 12px;border:1px solid var(--line);border-radius:10px;
  font-size:12px;color:var(--dim);background:rgba(30,27,24,.6)}
.proj b{color:var(--ink);font-weight:500}
.nav{display:flex;flex-direction:column;gap:2px}
.nav .grp{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);padding:16px 10px 7px;font-weight:500}
.nav a{position:relative;display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:9px;font-size:13px;color:var(--sec);
  transition:color .18s,background-color .18s}
.nav a svg{flex:none;opacity:.72;transition:opacity .18s}
.nav a:hover{color:var(--ink);background:rgba(241,235,225,.035)}
.nav a:hover svg{opacity:1}
.nav a:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
.nav a:active{transform:translateY(1px)}
.nav a.on{color:var(--ink);background:var(--raise);box-shadow:inset 2px 0 0 var(--gold)}
.nav a.on svg{opacity:1;color:var(--gold)}
.nav a.dim{color:var(--faint)}
.nav a .n{margin-left:auto;font-size:9px;color:var(--faint);font-family:var(--mono)}
.railfoot{margin-top:auto;padding:14px 4px 0;border-top:1px solid var(--line2)}
.acct{display:flex;align-items:center;gap:10px;padding:0 4px 12px}
.ava{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#D08770,#C9A98A);color:#231610;
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex:none}
.acct .who{min-width:0}
.acct .who .em{font-size:11.5px;color:#DDD4C4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acct .who .st{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin-top:2px}
.keybtn{display:block;width:100%;text-align:center;border:1px solid var(--line);border-radius:9px;padding:7px 10px;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:var(--sec);background:rgba(36,32,25,.5);
  transition:border-color .18s,color .18s,background-color .18s}
.keybtn:hover{color:var(--ink);border-color:#4A4033;background:var(--raise)}
.keybtn:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.keybtn:active{transform:translateY(1px)}
.arbig{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:4px}
.arfield{display:flex;flex-direction:column;gap:8px}
.arinput{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:#17140F}
.arinput .cur{font-family:var(--mono);font-size:12px;color:var(--dim)}
.inp.big{border:0;background:none;padding:0;font-size:14px;font-family:var(--mono);color:var(--ink);width:100%}
.inp.big:focus{outline:none}
.arinput:focus-within{border-color:var(--focus)}
.railbtns{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.railbtns .keybtn{padding:5px 8px;font-size:9.5px;border-radius:8px}
.keybtn.danger{color:#E06B4F;border-color:rgba(224,107,79,.45)}
.keybtn.danger:hover{color:#E8A18A;border-color:rgba(208,135,112,.65);background:rgba(208,135,112,.08)}
.acct .st .cli{display:inline-flex;align-items:center;gap:4px;margin-left:8px}
.raillinks{display:flex;align-items:center;gap:11px;padding:11px 4px 0;font-family:var(--mono);font-size:10px;color:var(--dim);white-space:nowrap}
.raillinks a{transition:color .15s}
.raillinks a:hover{color:var(--ink)}
.raillinks a:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.raillinks .cli{margin-left:auto;display:flex;align-items:center;gap:5px}
.dot{width:5px;height:5px;border-radius:50%;background:var(--up);box-shadow:0 0 6px rgba(127,176,105,.7);flex:none}

/* ---------------- main / topbar ---------------- */
.main{padding:24px 32px 80px;max-width:1300px;width:100%;margin:0 auto;min-width:0}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:20px}
.top h1{font-weight:600;font-size:22px;letter-spacing:-.02em;line-height:1.15}
.top .sum{margin-top:6px;font-family:var(--mono);font-size:10.5px;color:var(--dim)}
.top .sum b{color:var(--sec);font-weight:500}
.topact{display:flex;align-items:center;gap:10px;flex:none}
.scope{display:flex;border:1px solid var(--line);border-radius:999px;padding:2px;background:rgba(30,27,24,.7)}
.scope button{display:flex;align-items:center;gap:7px;padding:5px 13px;border-radius:999px;font-size:12px;color:var(--dim);
  transition:color .18s,background-color .18s}
.scope button:hover{color:var(--ink)}
.scope button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.scope button:active{transform:translateY(1px)}
.scope button.on{color:var(--ink);background:#2B251E;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--gold) 45%,transparent)}
.scope button b{width:6px;height:6px;border-radius:50%;font-size:0;flex:none}
.scope button:nth-child(1) b{background:var(--loc)}
.scope button:nth-child(2) b{background:var(--gold)}
.getkey{display:inline-flex;align-items:center;gap:6px;background:linear-gradient(180deg,#DDB26A,#C89B5A);color:#241C12;border-radius:999px;
  padding:7px 15px;font-size:12.5px;font-weight:600;letter-spacing:-.01em;border:1px solid var(--ink);
  transition:background-color .18s,transform .18s}
.getkey:hover{background:#FFF9EC}
.getkey:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.getkey:active{transform:translateY(1px)}
.tag-demo{border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-family:var(--mono);font-size:9px;letter-spacing:.12em;color:var(--faint)}

/* ---------------- panels ---------------- */
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.panel{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:14px;min-width:0;--acc:var(--cld);
  box-shadow:0 1px 2px rgba(20,12,4,.5),0 4px 12px rgba(20,12,4,.35);
  transition:border-color .25s,box-shadow .25s,transform .25s cubic-bezier(.22,1,.36,1)}
.panel::before{content:'';position:absolute;left:16px;right:16px;top:-1px;height:2px;border-radius:2px;
  background:var(--accbg,color-mix(in srgb,var(--acc) 60%,transparent))}
.panel:hover{border-color:color-mix(in srgb,var(--acc) 26%,var(--line));
  box-shadow:0 1px 2px rgba(20,12,4,.5),0 8px 22px rgba(20,12,4,.44)}
.panel.lift{cursor:default}
.panel.lift:hover{transform:translateY(-2px)}
/* anchor-click landing cue: a very faint two-second glow on the target panel
 * (owner 2026-08-10 — a short page may not scroll, so the click must still
 * visibly land). transform/opacity-free; reduced-motion users keep it since
 * it is a static fade, not movement. */
@keyframes anchorFlash{0%{border-color:color-mix(in srgb,var(--acc) 55%,var(--line));box-shadow:0 1px 2px rgba(20,12,4,.5),0 0 0 3px color-mix(in srgb,var(--acc) 16%,transparent)}100%{border-color:var(--line);box-shadow:0 1px 2px rgba(20,12,4,.5),0 4px 12px rgba(20,12,4,.35)}}
.panel.anchor-flash,section.anchor-flash{animation:anchorFlash 2s ease-out 1}
div.anchor-flash .panel:first-child{animation:anchorFlash 2s ease-out 1}
.ph{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:15px 18px 0}
.ph .t{font-size:14px;font-weight:600;letter-spacing:-.01em;color:var(--ink)}
.ph .t em{font-style:normal;font-family:var(--mono);font-weight:400;font-size:10px;color:var(--dim);margin-left:8px;letter-spacing:0}
.ph .r{font-family:var(--mono);font-size:10.5px;color:var(--dim);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ph .r b{color:var(--sec);font-weight:500}
.pb{padding:13px 18px 17px}
.in{animation:rise .55s cubic-bezier(.22,1,.36,1) both;animation-delay:var(--d,0ms)}
@keyframes rise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}

/* type */
.money{font-weight:600;font-size:46px;letter-spacing:-.035em;line-height:1.05;font-feature-settings:'tnum'}
.money small{font-size:24px;font-weight:500;color:var(--dim);letter-spacing:-.02em}
.stat .l{font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim);font-weight:500}
.stat .v{font-weight:600;font-size:26px;letter-spacing:-.03em;margin-top:6px;font-feature-settings:'tnum'}
.stat .s{font-family:var(--mono);font-size:10px;color:var(--dim);margin-top:5px}
.up{color:var(--up)}.dn{color:var(--dn)}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:999px;padding:1px 8px;
  font-family:var(--mono);font-size:10px;color:var(--sec);white-space:nowrap}
.chip.gd{color:var(--up);border-color:rgba(127,176,105,.4)}
.chip.wr{color:var(--cld);border-color:rgba(201,169,138,.45)}
.chip.rd{color:var(--dn);border-color:rgba(208,135,112,.45)}
.wow{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 10px;font-family:var(--mono);font-size:10.5px;font-weight:500}
.wow.bad{color:#E8A88F;background:rgba(208,135,112,.13);border:1px solid rgba(208,135,112,.35)}
.wow.good{color:#9CC487;background:rgba(127,176,105,.12);border:1px solid rgba(127,176,105,.32)}
.lg{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10px;color:var(--dim);white-space:nowrap}
.lg i{width:8px;height:8px;border-radius:2.5px;background:var(--c,#555);flex:none}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:5px 14px;
  font-size:12px;color:var(--sec);background:rgba(36,32,25,.55);transition:border-color .18s,background-color .18s,color .18s}
.btn:hover{border-color:#4A4033;background:var(--raise);color:var(--ink)}
.btn:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.btn:active{transform:translateY(1px)}
.btn.danger:hover{border-color:rgba(208,135,112,.55);color:var(--m-fable)}

/* tables */
.tblwrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);font-weight:500;text-align:left;
  padding:6px 10px;white-space:nowrap;border-bottom:1px solid var(--line2)}
th.num,td.num{text-align:right}
td.num{font-family:var(--mono);font-size:11.5px}
th.sort{cursor:pointer;transition:color .18s}
th.sort:hover{color:var(--ink)}
th.sort:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
th.sort.on{color:var(--ink)}
th.sort.on::after{content:' ↓';color:var(--cld)}
th.sort.on.asc::after{content:' ↑'}
td{padding:8px 10px;border-top:1px solid var(--line2);color:#D9CFBE;white-space:nowrap}
tr.hv{transition:background-color .15s}
tr.hv:hover{background:rgba(241,235,225,.03)}
tr.sel td{background:rgba(241,235,225,.045)}
td .sub{color:var(--dim);font-size:10.5px}
.mid{display:inline-flex;align-items:center;gap:8px}
.mid i{width:8px;height:8px;border-radius:2.5px;background:var(--c);flex:none}
.mid .mname{font-family:var(--mono);font-size:11.5px;color:var(--ink)}
.meter{display:block;position:relative;height:4px;border-radius:2px;background:#2A241D;overflow:hidden}
.meter b{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:var(--c,var(--cld))}
.bar-cell{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.bar-cell .meter{width:60px;flex:none}

/* charts shared */
.xaxis{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;color:var(--dim);padding-top:7px}
.hoverline{transition:opacity .12s}

/* chart interactions */
#sank .ribbon{transition:opacity .18s;cursor:pointer}
#sank.focus .ribbon{opacity:.13}
#sank.focus .ribbon.on2{opacity:.85}
#sank.focus .redge{opacity:.12}
.tmcell rect{transition:opacity .15s}
.tmcell:hover rect{opacity:1}
.heat{display:grid;grid-template-columns:repeat(24,1fr);grid-auto-rows:1fr;gap:1.5px;height:206px}
.dheat{display:grid;grid-template-columns:repeat(auto-fill,13px);grid-auto-rows:13px;gap:4px;justify-content:start;align-content:start}
.dheat b{border-radius:3px;background:#241F1A;transition:transform .12s}
.dheat b:hover{transform:scale(1.25)}
.dheat b.fut{background:repeating-linear-gradient(135deg,#1E1A16,#1E1A16 3px,#232019 3px,#232019 6px);opacity:.5}
.heat b{border-radius:2px;background:#241F1A;transition:transform .12s}
.heat b:hover{transform:scale(1.35)}
.heat b.mx{box-shadow:0 0 0 1px var(--vio)}
.heat b.fut{background:repeating-linear-gradient(135deg,#1E1A16,#1E1A16 2px,#232019 2px,#232019 4px);opacity:.5}
.hlab{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;color:var(--dim);margin-top:7px}
#scat .sdot{transition:r .15s;cursor:pointer}
#scat .sdot:hover{r:8}
#vol90 .hit,#chg30 .hit,#ct90 .hit,#rq90 .hit,#lat .hit{cursor:crosshair}

/* facts */
.facts{display:grid;grid-template-columns:repeat(2,1fr);gap:12px 18px;margin-top:16px}
.facts .f .l{font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--faint);font-weight:500}
.facts .f .v{font-family:var(--mono);font-size:11.5px;color:#D9CFBE;margin-top:3px}

/* model cards */
.mgroup{margin-top:24px}
.mgroup h2{font-weight:600;font-size:16px;letter-spacing:-.015em}
.mgroup h2 span{font-family:var(--mono);font-weight:400;font-size:10px;color:var(--dim);margin-left:10px;letter-spacing:.03em}
.modelgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:12px}
.mcard{display:flex;gap:15px;padding:15px;align-items:stretch}
/* clickable model surfaces read as clickable (owner 2026-08-09) */
.panel.lift.mcard,.mcard{cursor:pointer}
tr.mrow{cursor:pointer}
.mstrip{display:flex;flex-wrap:wrap;gap:7px;margin:2px 0 16px;align-items:center}
/* a Show-more button living INSIDE the chip strip is a chip, not a footer bar
 * (owner 2026-08-09: "second row buttons twice as tall" — the footer-styled
 * wrap was stretching its flex row) */
.mstrip .showmore-wrap{border-top:0;padding:0;margin:0;display:inline-flex}
.mstrip .showmore{padding:5px 12px;font-size:11px}
.mchip{display:inline-flex;align-items:center;gap:7px;padding:5px 12px;border-radius:999px;border:1px solid var(--line);
  background:transparent;color:var(--sec);font-family:var(--mono);font-size:11px;cursor:pointer;
  transition:color .15s ease,border-color .15s ease,background-color .15s ease,transform .15s ease}
.mchip i{width:7px;height:7px;border-radius:50%;background:var(--c);flex:none}
.mchip:hover{color:var(--ink);border-color:#4A4033}
.mchip:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.mchip:active{transform:translateY(1px)}
.mchip.on{color:var(--ink);background:var(--raise);border-color:color-mix(in srgb,var(--gold) 55%,var(--line))}
.plate{width:96px;border-radius:11px;flex:none;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(120% 90% at 50% 32%,color-mix(in srgb,var(--c) 15%,var(--panel)),color-mix(in srgb,var(--c) 5%,var(--panel)) 78%);
  box-shadow:inset 0 2px 9px rgba(20,12,4,.38),inset 0 0 0 1px color-mix(in srgb,var(--c) 16%,transparent)}
.plate svg{width:64px;height:64px}
.mcard .body{min-width:0;flex:1;display:flex;flex-direction:column}
.mcard .mname{font-family:var(--mono);font-weight:500;font-size:14px;letter-spacing:-.01em;color:var(--ink);
  display:flex;align-items:center;gap:7px}
.mcard .mname i{width:7px;height:7px;border-radius:50%;background:var(--c);flex:none}
.mcard .prov{font-size:10px;color:var(--dim);margin-top:1px;font-family:var(--mono)}
.mcard .blurb{font-size:11.5px;line-height:1.5;color:var(--sec);margin-top:6px}
.mcard .foot{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-top:auto;padding-top:10px}
.mcard .nums{font-family:var(--mono);font-size:10.5px;color:var(--sec);line-height:1.7;white-space:nowrap}
.mcard .nums b{color:var(--faint);font-weight:400;margin-right:5px}
.mcard .sparkbox{display:flex;align-items:center;gap:8px;min-width:0;flex:0 1 auto}
.mcard .sparkbox svg{flex:0 1 auto;min-width:0;max-width:100%;height:auto}
.delta{font-family:var(--mono);font-size:10.5px;flex:none}

/* models view */
.detail{display:grid;grid-template-columns:288px minmax(0,1fr);gap:22px}
.dplate{width:132px;height:132px;border-radius:14px;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(120% 90% at 50% 32%,color-mix(in srgb,var(--c) 16%,var(--panel)),color-mix(in srgb,var(--c) 5%,var(--panel)) 80%);
  box-shadow:inset 0 2px 10px rgba(20,12,4,.4),inset 0 0 0 1px color-mix(in srgb,var(--c) 18%,transparent)}
.dplate svg{width:92px;height:92px}
.dname{font-family:var(--mono);font-weight:500;font-size:17px;color:var(--ink);margin-top:13px}
.dprov{font-family:var(--mono);font-size:10.5px;color:var(--dim);margin-top:3px}
.dblurb{font-size:12px;line-height:1.55;color:var(--sec);margin-top:9px}
.dtags{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.benchgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}

/* ---- cost 90d: daily bars + 7d moving average ---- */
function cost90(sc){
  var days=sc.days,W=1180,H=170,n=days.length,bw=W/n;
  /* sparse-window cap: a 1-3-day calendar must not paint full-bleed slabs */
  var cw=Math.min(bw,W/30);
  var m=mx(days.map(function(d){return d.cost||0}))||1,g='';
  [0.5,1].forEach(function(q){
    var y=(1-q)*(H-8)+4;
    g+='<line x1="0" y1="'+y.toFixed(1)+'" x2="'+W+'" y2="'+y.toFixed(1)+'" stroke="'+GRID+'" stroke-width="1"/>'+
       '<text x="4" y="'+(y+13).toFixed(1)+'" font-size="10" fill="'+FNT+'" font-family="Spline Sans Mono,monospace">'+F.usd(m*q)+'</text>';
  });
  var ma=[];
  days.forEach(function(d,i){
    var x=(i*bw+(bw-cw)/2).toFixed(2),w=Math.max(cw-1.6,2.2).toFixed(2);
    var h=d.cost?Math.max((d.cost/m)*(H-8),2.5):0;
    if(h)g+='<rect x="'+x+'" y="'+(H-h).toFixed(2)+'" width="'+w+'" height="'+h.toFixed(2)+'" fill="'+CLD+'" opacity="0.38"/>';
    var w0=Math.max(0,i-6),win=days.slice(w0,i+1);

    /* nonzero floor: flat = zero; tiny real spend stays a visible hump */

    ma.push([i*bw+bw/2, my]);
  });
  g+='<path d="'+monoD(ma)+'" fill="none" stroke="#E8D3B2" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>';
  var last=ma[ma.length-1];
  g+='<circle cx="'+last[0].toFixed(1)+'" cy="'+last[1].toFixed(1)+'" r="2.6" fill="#E8D3B2"/>';
  days.forEach(function(d,i){
    g+='<rect class="hit" data-i="'+i+'" x="'+(i*bw).toFixed(2)+'" y="0" width="'+bw.toFixed(2)+'" height="'+H+'" fill="transparent"/>';
  });
  return '<svg id="ct90" viewBox="0 0 '+W+' '+H+'" width="100%" style="height:180px" preserveAspectRatio="none">'+g+'</svg>';
}
/* ---- movers rows (cost view) ---- */
function movers(sc){
  var cpr={};
  sc.byModel.forEach(function(b){cpr[b.id]=b.req&&b.cost?b.cost/b.req:0});
  var rows=sc.byModel.filter(function(b){return (b.kind||(MODEL[b.id]||{}).kind)==='cloud'}).sort(function(a,b){return (b.cost||0)-(a.cost||0)});
  if(!rows.length)return emptyNote('no cloud traffic measured in this window');
  if(REAL){
    /* spend rows appear only when there IS spend (owner rule 2026-08-07):
     * no $0.00 row frames. Unreadable cost stays a named red dash. */
    var paid=rows.filter(function(b){return b.cost>0});
    if(!paid.length){
      var unread=rows.some(function(b){return b.cost==null});
      return '<div class="quiet-empty">'+(unread
        ?RD('disclosed cost unreadable: telemetry schema drift on this CLI (HARDENING money-charged)')+' <span style="margin-left:7px">per-model spend unreadable on this source — rows appear when a charged request lands with readable cost</span>'
        :'no cloud spend this window · rows appear with your first charged request')+'</div>';

  }
  var out='';
  rows.forEach(function(r){
    /* the daily series: the model's own per-day requests (spark — served by
     * the account aggregate) × its measured cost-per-request; the d.m matrix
     * is the machine/demo fallback. The flat lines were this map reading a
     * matrix the account scope never had (owner report 2026-08-09). */
    var mi=D.models.findIndex(function(mm){return mm.id===r.id});
    var reqSeries=(r.spark&&r.spark.length?r.spark:sc.days.slice(-14).map(function(d){
      return (d.m&&d.m[mi])||0;
    }));
    var est=reqSeries.map(function(v){return v*cpr[r.id]});
    var d=delta14(est);
    out+='<div class="mover"><span class="nm"><span class="mid" style="--c:'+mc(r.id)+'"><i></i><span class="mname">'+e(shortId(r.id))+'</span></span><span class="sub">'+e((MODEL[r.id]||{}).provider||'')+'</span></span>'+
      '<span class="cost">'+fUsd(r.cost,'disclosed cost unreadable: telemetry schema drift on this CLI (HARDENING money-charged)')+
      (WAIVED&&r.billing==='byok'?' <span style="color:var(--m-qwen14);font-size:10px">fee waived</span>'
        :(r.fee?' <span style="color:var(--faint);font-size:10px">+'+F.usd(r.fee)+' fee</span>':''))+'</span>'+
      '<span>'+spark(est,mc(r.id),150,26)+'</span>'+
      '<span class="dl">'+deltaTag(d)+'</span></div>';

function wire(){
  var q=function(s2){return document.querySelector(s2)};
  var qa=function(s2){return Array.prototype.slice.call(document.querySelectorAll(s2))};
  /* every number field gets the dashboard steppers (native spinners hidden) */
  qa('#view input[type=number]').forEach(function(inp){
    if(inp.dataset.spun==='1')return;
    inp.dataset.spun='1';
    var sp=document.createElement('span');sp.className='spinner';
    var mk=function(dir,ch){
      var b=document.createElement('button');b.type='button';b.textContent=ch;
      b.setAttribute('aria-label',dir>0?'increase':'decrease');
      b.addEventListener('click',function(){
        var st=parseFloat(inp.step)||1,v=parseFloat(inp.value);
        if(isNaN(v))v=parseFloat(inp.min)||0;else v+=dir*st;
        var mn=inp.min!==''?parseFloat(inp.min):null;
        if(mn!=null&&v<mn)v=mn;
        inp.value=String(Math.round(v*100)/100);
        inp.dispatchEvent(new Event('input',{bubbles:true}));
      });
      return b;
    };
    sp.appendChild(mk(1,'▲'));sp.appendChild(mk(-1,'▼'));
    inp.insertAdjacentElement('afterend',sp);

  /* MODELSPEC: Show more / Show fewer toggles (per-surface open state) */

/* ================= shell / router ================= */
var ROUTES=['dashboard','usage','cost','models','routing','keys','billing','limits'];
var TITLES={dashboard:'Dashboard',usage:'Usage',cost:'Cost',models:'Models',routing:'Routing',keys:'Keys',billing:'Billing',limits:'Limits'};
/* sidebar order MUST mirror the page's top-to-bottom section order — the
 * scroll-spy walks these anchors, and any mismatch makes the highlight jump
 * backwards while scrolling (owner 2026-08-09) */
var NET_TABS=[['n-volume','Token volume','usage'],['n-flow','Flow','routing'],['n-activity','Activity','dashboard'],['n-models','Models','models'],['n-usage','Usage','share'],['n-latency','Latency','limits']];
var CO_TABS=[['c-usage','Members usage','usage'],['c-members','Members & roles','members'],['c-invite','Invite','share'],['c-keys','Company keys','keys']];
function anchorNav(tabs){
  return tabs.map(function(t2){
    return '<a href="index.html" data-anchor="'+t2[0]+'" class="'+(state.anchor===t2[0]?'on':'')+'">'+ic(t2[2])+'<span>'+t2[1]+'</span></a>';
  }).join('');
}
function navHtml(){
  if(state.scope==='network')return anchorNav(NET_TABS);
  if(state.scope==='company')return anchorNav(CO_TABS);
  /* routing is a machine read (this CLI's policy files) — account scope has no source for it */
  var g1=state.scope==='account'?['dashboard','usage','cost','models']:['dashboard','usage','cost','models','routing'],g2=['keys','billing','limits'];
  var mk=function(v2){
    return '<a href="#/'+v2+'" data-v="'+v2+'" class="'+(state.view===v2?'on':'')+'">'+ic(v2)+'<span>'+TITLES[v2]+'</span></a>';
  };
  return g1.map(mk).join('')+'<div class="grp">account</div>'+g2.map(mk).join('');
}
function summary(){
  var t=S().totals,nr=S().emptyReason||'no measured traffic';
  /* owner 2026-08-08: a blank stat line ("— requests · — tokens routed · no
   * recorded traffic yet") is noise — render nothing until there is data */
  if(REAL&&!(t&&t.requests>0))return '';
  if(state.scope==='network'){
    var fx=S().facts||{};
    return '<b>'+fInt(t.requests,nr)+'</b> requests · <b>'+fTok(tokSum(t),nr)+'</b> tokens routed · '+per()+floorNote();
  }
  if(state.scope==='company'){
    var mN=S().membersCount;
    return '<b>'+fInt(mN,S().membersReason||'billing GET /orgs/:id/usage unavailable')+'</b> members · <b>'+fInt(t.requests,nr)+'</b> requests · '+e(scLabel())+' · '+per()+floorNote();
  }
  return '<b>'+fInt(t.requests,nr)+'</b> requests · <b>'+fTok(tokSum(t),nr)+'</b> tokens routed · '+e(scLabel())+' · '+per()+floorNote();
}

function setScope(s2){
  if(state.scope===s2)return;

function route(){
  var h=(location.hash||'#/dashboard').replace(/^#\//,'');
  var qm=h.match(/^models\?m=([\w.\-]+)$/);
  if(qm){h='models';if(MODEL[qm[1]])state.sel=qm[1];}
  if(state.scope==='network'||state.scope==='company')h='dashboard';
  state.view=ROUTES.indexOf(h)>=0?h:'dashboard';
  state.mintOpen=false;state.mintToken=null;state.payMsg=null;
  render(true);
  window.scrollTo(0,0);
