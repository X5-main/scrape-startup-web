  // Official Cal.com embed loader — queues Cal() calls until embed.js arrives.
  (function (C, A, L) {
    let p = function (a, ar) {
      a.q.push(ar)

    let d = C.document
    C.Cal =

      function () {
        let cal = C.Cal
        let ar = arguments
        if (!cal.loaded) {

          const api = function () {

          if (typeof namespace === "string") {

  // embed.js's [data-cal-link] click handler doesn't preventDefault, so our
  // anchor fallback hrefs would also navigate. This listener registers before
  // embed.js loads, so it runs first; preventDefault doesn't stop propagation,
  // so Cal's handler still opens the modal.
  document.addEventListener("click", (e) => {
    const el =
      e.target instanceof Element ? e.target.closest("[data-cal-link]") : null
    if (!(el instanceof HTMLElement)) return

    const theme = document.documentElement.dataset.theme

      el.dataset.calConfig = JSON.stringify({ theme, layout: "month_view" })
