name: CI

on:
  push:
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - name: Syntax gate (compileall)
        run: find . -name '*.py' -not -path './.git/*' -print0 | xargs -0 python3 -m compileall

      - name: Import smoke
        run: python3 scripts/import_smoke.py

      - name: Serve replica smoke
        run: |
          python3 serve_replica.py 18899 &
          PID=$!
          sleep 1
          code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18899/)"
          [ "$code" = "200" ] || { echo "FAIL: GET / returned ${code}"; exit 1; }
          echo "GET / → 200 OK"
          code="$(curl -s -X POST -o /dev/null -w '%{http_code}' http://127.0.0.1:18899/some-route)"
          [ "$code" = "200" ] || { echo "FAIL: POST /some-route returned ${code}"; exit 1; }
          echo "POST /some-route → 200 OK"
          code="$(curl -s -o /dev/null -w '%{http_code}' 'http://127.0.0.1:18899/_next/image?url=%2Ficon0.svg&w=64&q=75')"
          [ "$code" = "200" ] || { echo "FAIL: GET /_next/image returned ${code}"; exit 1; }
          echo "GET /_next/image → 200 OK"
          kill $PID 2>/dev/null || true

      - name: Secrets hygiene
        run: |
          # High-signal credential material: exact formats, never placeholders.
          if grep -rPnI --exclude-dir=.github --include='*.py' --include='*.md' --include='*.yml' \
              --include='*.yaml' --include='*.json' --include='*.sh' \
              'sk-[a-zA-Z0-9]{20,}|BEGIN[[:space:]]+(RSA|DSA|EC|OPENSSH)[[:space:]]+PRIVATE' .; then
            echo "FAIL: real secret material detected (sk- key / private key block)"
            exit 1
          fi
          # key=value-ish assignments: flag only LITERAL values (>= 12 chars) that are
          # not $VAR/${VAR}/$(...) references, <placeholders>, env-var NAMES, or "your_*"
          # snippet placeholders. Real secret values fail; documentation placeholders pass.
          find . -path ./.git -prune -o -path ./.github -prune -o -type f \
              \( -name '*.py' -o -name '*.md' -o -name '*.yml' -o -name '*.yaml' \
                 -o -name '*.json' -o -name '*.sh' \) -print0 \
              | xargs -0 awk -f .github/scripts/secrets-hygiene.awk \
              || { echo "FAIL: suspect literal secret values detected"; exit 1; }
          echo "PASS: no secrets found"
