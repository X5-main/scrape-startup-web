<!-- CLICK MUTED BUTTON -->
<script>
const videoDesktop = document.getElementById("video-desktop");
const videoMobile = document.getElementById("video-mobile");
const button = document.getElementById("muteBtn");
const mutedSvg = document.getElementById("mutedSvg");
const soundSvg = document.getElementById("soundSvg");

button.addEventListener("click", function () {
 
  let video = window.innerWidth < 479 ? videoMobile : videoDesktop;

  if (video.muted) {
    mutedSvg.style.display = "none";
    soundSvg.style.display = "inline";
    video.muted = false;
    video.play();
  } else {
    mutedSvg.style.display = "inline";
    soundSvg.style.display = "none";
    video.muted = true;
    video.play();
  }
});
</script>
