<script>
  // Lazy-load Lottie only when animation enters the viewport
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        const el = entry.target;
        // Resume/unfreeze the lottie player
        if (el.getLottieInstance) {
          el.getLottieInstance().play();
        }
        // For <lottie-player> web component
        if (el.play) {
          el.play();
        }
        observer.unobserve(el);
      }
    });
  }, { rootMargin: '200px' }); // start loading 200px before it enters view

  // Wait for DOM + Framer to finish rendering
  window.addEventListener('load', () => {
    document.querySelectorAll('lottie-player, [class*="lottie"]').forEach(el => {
      el.stop?.(); // pause immediately
      observer.observe(el);
    });
  });
</script>
