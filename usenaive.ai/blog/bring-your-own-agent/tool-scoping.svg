<svg width="900" height="430" viewBox="0 0 900 430" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="'SF Mono','IBM Plex Mono',ui-monospace,monospace">
  <rect width="900" height="430" rx="16" fill="#fbf9f6"/>
  <rect x="0.5" y="0.5" width="899" height="429" rx="16" fill="none" stroke="rgba(0,0,0,0.1)"/>

  <text x="32" y="44" font-size="13" letter-spacing="2" fill="#777777">SAME MCP ENDPOINT, DIFFERENT TOOL LIST -- THE KIT IS THE FILTER</text>

  <!-- Member kit -->
  <rect x="32" y="74" width="392" height="316" rx="12" fill="#ffffff" stroke="rgba(0,0,0,0.16)"/>
  <text x="56" y="106" font-size="14" fill="#000000">Member kit -> listTools()</text>
  <text x="56" y="126" font-size="10.5" fill="#999999">cards/browser disabled; connections: gmail, linear</text>

  <rect x="56" y="146" width="344" height="32" rx="7" fill="#efedeb"/>
  <text x="72" y="167" font-size="12" fill="#000000">naive_send_email</text>
  <rect x="56" y="186" width="344" height="32" rx="7" fill="#efedeb"/>
  <text x="72" y="207" font-size="12" fill="#000000">naive_connections_execute</text>
  <text x="384" y="207" font-size="10.5" fill="#777777" text-anchor="end">gmail, linear only</text>
  <rect x="56" y="226" width="344" height="32" rx="7" fill="#efedeb"/>
  <text x="72" y="247" font-size="12" fill="#000000">naive_logs_query</text>
  <rect x="56" y="266" width="344" height="32" rx="7" fill="#f3f1ee" stroke="rgba(0,0,0,0.06)"/>
  <text x="72" y="287" font-size="12" fill="#bbbbbb">naive_cards_create</text>
  <text x="384" y="287" font-size="11" fill="#bbbbbb" text-anchor="end">not in list</text>
  <rect x="56" y="306" width="344" height="32" rx="7" fill="#f3f1ee" stroke="rgba(0,0,0,0.06)"/>
  <text x="72" y="327" font-size="12" fill="#bbbbbb">naive_browser_signup</text>
  <text x="384" y="327" font-size="11" fill="#bbbbbb" text-anchor="end">not in list</text>
  <text x="56" y="364" font-size="10.5" fill="#777777">disabled primitives never reach the agent's tool list</text>

  <!-- Admin kit -->
  <rect x="476" y="74" width="392" height="316" rx="12" fill="#ffffff" stroke="rgba(0,0,0,0.16)"/>
  <text x="500" y="106" font-size="14" fill="#000000">Admin kit -> listTools()</text>
  <text x="500" y="126" font-size="10.5" fill="#999999">cards/browser enabled, requiresApproval; all connections</text>

  <rect x="500" y="146" width="344" height="32" rx="7" fill="#efedeb"/>
  <text x="516" y="167" font-size="12" fill="#000000">naive_send_email</text>
  <rect x="500" y="186" width="344" height="32" rx="7" fill="#efedeb"/>
  <text x="516" y="207" font-size="12" fill="#000000">naive_connections_execute</text>
  <rect x="500" y="226" width="344" height="32" rx="7" fill="#efedeb"/>
  <text x="516" y="247" font-size="12" fill="#000000">naive_logs_query</text>
  <rect x="500" y="266" width="344" height="32" rx="7" fill="#efedeb"/>
  <text x="516" y="287" font-size="12" fill="#000000">naive_cards_create</text>
  <text x="828" y="287" font-size="11" fill="#a98600" text-anchor="end">-> pending_approval</text>
  <rect x="500" y="306" width="344" height="32" rx="7" fill="#efedeb"/>
  <text x="516" y="327" font-size="12" fill="#000000">naive_browser_signup</text>
  <text x="828" y="327" font-size="11" fill="#a98600" text-anchor="end">-> pending_approval</text>
  <text x="500" y="364" font-size="10.5" fill="#777777">sensitive calls freeze as a 202 approval until a human says yes</text>
</svg>
