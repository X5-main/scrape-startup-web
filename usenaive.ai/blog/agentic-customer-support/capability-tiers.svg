<svg width="880" height="430" viewBox="0 0 880 430" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="'SF Mono','IBM Plex Mono',ui-monospace,monospace">
  <rect width="880" height="430" rx="16" fill="#fbf9f6"/>
  <rect x="0.5" y="0.5" width="879" height="429" rx="16" fill="none" stroke="rgba(0,0,0,0.1)"/>

  <text x="32" y="44" font-size="13" letter-spacing="2" fill="#777777">SAME AGENT CODE - DIFFERENT ACCOUNT KIT - API ENFORCES THE LINE</text>

  <!-- shared agent code box -->
  <rect x="300" y="66" width="280" height="58" rx="10" fill="#ffffff" stroke="rgba(0,0,0,0.16)"/>
  <text x="440" y="90" font-size="13" fill="#000000" text-anchor="middle">handleTicket(customerId)</text>
  <text x="440" y="110" font-size="10.5" fill="#999999" text-anchor="middle">one codebase, scoped with forUser(id)</text>

  <!-- arrows down to tiers -->
  <path d="M380 124C380 150 250 150 230 168" stroke="#000000" stroke-opacity="0.35" stroke-width="1.6" fill="none"/>
  <path d="M230 168l8 -2 -5 -7z" fill="#000000" fill-opacity="0.35"/>
  <path d="M500 124C500 150 650 150 660 168" stroke="#000000" stroke-opacity="0.35" stroke-width="1.6" fill="none"/>
  <path d="M660 168l-3 -7 -5 6z" fill="#000000" fill-opacity="0.35"/>

  <!-- Starter tier -->
  <rect x="40" y="172" width="392" height="218" rx="12" fill="#ffffff" stroke="rgba(0,0,0,0.14)"/>
  <text x="60" y="200" font-size="14" fill="#000000">Support - Starter</text>
  <text x="60" y="220" font-size="10.5" fill="#999999">mode: "allowlist"  toolkits: ["gmail"]</text>

  <rect x="60" y="236" width="352" height="30" rx="7" fill="#eef4ee" stroke="#bcd6bc"/>
  <text x="74" y="255" font-size="11.5" fill="#3f7d4e">Gmail  -  GMAIL_FETCH_EMAILS, GMAIL_SEND_EMAIL</text>

  <rect x="60" y="274" width="352" height="30" rx="7" fill="#f5e9e4" stroke="#e7c3b5"/>
  <text x="74" y="293" font-size="11.5" fill="#b4582f">Slack   -  not allowlisted  ->  forbidden</text>

  <rect x="60" y="312" width="352" height="30" rx="7" fill="#f5e9e4" stroke="#e7c3b5"/>
  <text x="74" y="331" font-size="11.5" fill="#b4582f">Stripe  -  not allowlisted  ->  forbidden</text>

  <text x="60" y="368" font-size="11" fill="#777777">Triage + reply only. No path to payments - at all.</text>

  <!-- Resolve tier -->
  <rect x="448" y="172" width="392" height="218" rx="12" fill="#ffffff" stroke="rgba(0,0,0,0.14)"/>
  <text x="468" y="200" font-size="14" fill="#000000">Support - Resolve</text>
  <text x="468" y="220" font-size="10.5" fill="#999999">mode: "allowlist"  toolkits: ["gmail","slack","stripe"]</text>

  <rect x="468" y="236" width="352" height="30" rx="7" fill="#eef4ee" stroke="#bcd6bc"/>
  <text x="482" y="255" font-size="11.5" fill="#3f7d4e">Gmail   -  read + send</text>

  <rect x="468" y="274" width="352" height="30" rx="7" fill="#eef4ee" stroke="#bcd6bc"/>
  <text x="482" y="293" font-size="11.5" fill="#3f7d4e">Slack    -  escalate to the team</text>

  <rect x="468" y="312" width="352" height="30" rx="7" fill="#fdeee9" stroke="#e7c3b5"/>
  <text x="482" y="331" font-size="11.5" fill="#b4582f">Stripe   -  refunds;  connect -> pending_approval</text>

  <text x="468" y="368" font-size="11" fill="#777777">Can move money - connecting Stripe freezes for a human.</text>
</svg>
