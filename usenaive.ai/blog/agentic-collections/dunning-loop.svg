<svg width="900" height="360" viewBox="0 0 900 360" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="'SF Mono','IBM Plex Mono',ui-monospace,monospace">
  <rect width="900" height="360" rx="16" fill="#fbf9f6"/>
  <rect x="0.5" y="0.5" width="899" height="359" rx="16" fill="none" stroke="rgba(0,0,0,0.1)"/>
  <rect x="0" y="0" width="900" height="6" rx="3" fill="#2f7d4f"/>

  <text x="32" y="46" font-size="13" letter-spacing="2" fill="#777777">THE AUTONOMOUS DUNNING LOOP - RUNS INSIDE THE CLIENT'S OWN CONTAINER</text>

  <!-- cron -->
  <rect x="32" y="72" width="150" height="66" rx="10" fill="#f2eef8" stroke="#d8c5e2"/>
  <text x="107" y="100" font-size="13" fill="#5a3d86" text-anchor="middle">cron fires</text>
  <text x="107" y="120" font-size="10" fill="#7a5aa6" text-anchor="middle">0 9 * * 1-5</text>

  <path d="M182 105H222" stroke="#000000" stroke-opacity="0.4" stroke-width="1.6"/>
  <path d="M222 105l-7 -4v8z" fill="#000000" fill-opacity="0.4"/>

  <!-- recall memory -->
  <rect x="224" y="72" width="164" height="66" rx="10" fill="#f2eef8" stroke="#d8c5e2"/>
  <text x="306" y="100" font-size="13" fill="#5a3d86" text-anchor="middle">recall memory</text>
  <text x="306" y="120" font-size="10" fill="#7a5aa6" text-anchor="middle">stage per invoice</text>

  <path d="M388 105H428" stroke="#000000" stroke-opacity="0.4" stroke-width="1.6"/>
  <path d="M428 105l-7 -4v8z" fill="#000000" fill-opacity="0.4"/>

  <!-- compose -->
  <rect x="430" y="72" width="164" height="66" rx="10" fill="#ffffff" stroke="rgba(0,0,0,0.14)"/>
  <text x="512" y="100" font-size="13" fill="#000000" text-anchor="middle">compose</text>
  <text x="512" y="120" font-size="10" fill="#777777" text-anchor="middle">llm - OpenRouter</text>

  <path d="M594 105H634" stroke="#000000" stroke-opacity="0.4" stroke-width="1.6"/>
  <path d="M634 105l-7 -4v8z" fill="#000000" fill-opacity="0.4"/>

  <!-- send -->
  <rect x="636" y="72" width="164" height="66" rx="10" fill="#ffffff" stroke="rgba(0,0,0,0.14)"/>
  <text x="718" y="100" font-size="13" fill="#000000" text-anchor="middle">send reminder</text>
  <text x="718" y="120" font-size="10" fill="#777777" text-anchor="middle">client's own inbox</text>

  <!-- down from send -->
  <path d="M718 138V178" stroke="#000000" stroke-opacity="0.4" stroke-width="1.6"/>
  <path d="M718 178l-4 -7h8z" fill="#000000" fill-opacity="0.4"/>

  <!-- record memory -->
  <rect x="636" y="186" width="164" height="66" rx="10" fill="#f2eef8" stroke="#d8c5e2"/>
  <text x="718" y="214" font-size="13" fill="#5a3d86" text-anchor="middle">record memory</text>
  <text x="718" y="234" font-size="10" fill="#7a5aa6" text-anchor="middle">advance the stage</text>

  <!-- loop back to cron next firing -->
  <path d="M636 219H120C120 219 107 219 107 178V144" stroke="#2f7d4f" stroke-opacity="0.6" stroke-width="1.6" fill="none"/>
  <path d="M107 144l-4 8 8 0z" fill="#2f7d4f" fill-opacity="0.6"/>
  <text x="300" y="212" font-size="11" fill="#3f7d4e">next firing continues the ladder</text>

  <!-- kit band -->
  <rect x="32" y="278" width="768" height="30" rx="7" fill="#eef4ee" stroke="#bcd6bc"/>
  <text x="42" y="298" font-size="11.5" fill="#3f7d4e">every step bounded by the client's Account Kit - and by their credit balance (insufficient_credits stops runaway runs)</text>

  <text x="32" y="336" font-size="11.5" fill="#999999">No shared scheduler, no shared memory - one client's job can never observe or starve another's.</text>
</svg>
