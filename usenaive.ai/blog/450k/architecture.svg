<svg width="880" height="430" viewBox="0 0 880 430" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="'SF Mono','IBM Plex Mono',ui-monospace,monospace">
  <rect width="880" height="430" rx="16" fill="#fbf9f6"/>
  <rect x="0.5" y="0.5" width="879" height="429" rx="16" fill="none" stroke="rgba(0,0,0,0.1)"/>

  <text x="32" y="44" font-size="13" letter-spacing="2" fill="#777777">PER-TENANT ISOLATION</text>

  <!-- Signup -->
  <rect x="32" y="70" width="150" height="64" rx="10" fill="#efedeb" stroke="rgba(0,0,0,0.12)"/>
  <text x="107" y="100" font-size="15" fill="#000000" text-anchor="middle">New signup</text>
  <text x="107" y="120" font-size="11" fill="#777777" text-anchor="middle">free, no card</text>

  <!-- Control plane -->
  <rect x="230" y="58" width="190" height="88" rx="10" fill="#ffffff" stroke="rgba(0,0,0,0.12)"/>
  <text x="325" y="86" font-size="14" fill="#000000" text-anchor="middle">Control plane</text>
  <text x="325" y="107" font-size="11" fill="#777777" text-anchor="middle">claim warm machine (~12s)</text>
  <text x="325" y="123" font-size="11" fill="#777777" text-anchor="middle">or provision (~53s)</text>
  <text x="325" y="139" font-size="10.5" fill="#999999" text-anchor="middle">Postgres = source of truth</text>

  <!-- arrows signup -> control -->
  <path d="M182 102H224" stroke="#000000" stroke-opacity="0.45" stroke-width="1.6"/>
  <path d="M224 102l-7 -4v8z" fill="#000000" fill-opacity="0.45"/>

  <!-- arrow control -> tenant -->
  <path d="M420 102H474" stroke="#000000" stroke-opacity="0.45" stroke-width="1.6"/>
  <path d="M474 102l-7 -4v8z" fill="#000000" fill-opacity="0.45"/>

  <!-- stacked tenant machines -->
  <rect x="492" y="86" width="232" height="150" rx="12" fill="#efedeb" stroke="rgba(0,0,0,0.10)"/>
  <rect x="482" y="74" width="232" height="150" rx="12" fill="#f3f1ee" stroke="rgba(0,0,0,0.10)"/>
  <rect x="472" y="62" width="232" height="150" rx="12" fill="#ffffff" stroke="rgba(0,0,0,0.16)"/>

  <text x="488" y="86" font-size="13" fill="#000000">Fly Machine, 1 per tenant</text>
  <text x="488" y="108" font-size="11" fill="#555555">shared 2 vCPU / 2 GB RAM</text>
  <text x="488" y="128" font-size="11" fill="#555555">10 GB volume (tenant state)</text>
  <text x="488" y="148" font-size="11" fill="#555555">agent runtime + headless browser</text>
  <text x="488" y="168" font-size="11" fill="#555555">runs arbitrary generated code</text>
  <rect x="488" y="180" width="200" height="24" rx="6" fill="#fdeee9" stroke="#e7c3b5"/>
  <text x="498" y="196" font-size="11" fill="#b4582f">restart: always (never stops)</text>

  <!-- metering proxy -->
  <rect x="330" y="266" width="200" height="74" rx="10" fill="#ffffff" stroke="rgba(0,0,0,0.12)"/>
  <text x="430" y="294" font-size="14" fill="#000000" text-anchor="middle">Metering proxy</text>
  <text x="430" y="314" font-size="11" fill="#777777" text-anchor="middle">injects real key server-side</text>
  <text x="430" y="330" font-size="11" fill="#777777" text-anchor="middle">meters tokens per request</text>

  <!-- arrow tenant -> proxy (scoped key) -->
  <path d="M560 212C560 250 520 250 500 266" stroke="#000000" stroke-opacity="0.4" stroke-width="1.6" fill="none"/>
  <path d="M500 266l8 -2 -5 -6z" fill="#000000" fill-opacity="0.4"/>
  <text x="566" y="250" font-size="10.5" fill="#999999">scoped key only</text>

  <!-- Anthropic / Claude -->
  <rect x="600" y="262" width="248" height="82" rx="10" fill="#fdeee9" stroke="#e7c3b5"/>
  <g transform="translate(622,286) scale(0.0145)">
    <path d="m233.96 800.215 234.684-131.678 3.947-11.436-3.947-6.363h-11.436l-39.221-2.416-134.094-3.624-116.296-4.832-112.67-6.04-28.35-6.04-26.577-35.035 2.738-17.477 23.84-16.027 34.147 2.98 75.463 5.155 113.235 7.812 82.147 4.832 121.692 12.644h19.329l2.738-7.812-6.604-4.832-5.154-4.832-117.182-79.41-126.845-83.92-66.443-48.321-35.92-24.484-18.12-22.953-7.813-50.093 32.618-35.92 43.812 2.98 11.195 2.98 44.375 34.147 94.792 73.37 123.786 91.167 18.12 15.06 7.249-5.154.886-3.624-8.135-13.61-67.329-121.692-71.838-123.785-31.974-51.302-8.456-30.765c-2.98-12.645-5.154-23.275-5.154-36.242l37.127-50.416 20.537-6.604 49.53 6.604 20.86 18.121 30.765 70.39 49.852 110.818 77.315 150.684 22.631 44.698 12.08 41.396 4.51 12.645h7.813v-7.248l6.362-84.886 11.759-104.215 11.436-134.094 3.946-37.772 18.685-45.262 37.127-24.482 28.994 13.852 23.839 34.148-3.303 22.067-14.174 92.134-27.785 144.323-18.121 96.644h10.55l12.08-12.08 48.887-64.913 82.147-102.685 36.242-40.752 42.282-45.02 27.14-21.423h51.303l37.772 56.135-16.913 57.986-52.832 67.007-43.812 56.779-62.82 84.563-39.22 67.651 3.623 5.396 9.343-.886 141.906-30.201 76.671-13.852 91.49-15.705 41.396 19.329 4.51 19.65-16.269 40.189-97.852 24.16-114.764 22.954-170.9 40.43-2.093 1.53 2.416 2.98 76.993 7.248 32.94 1.771h80.617l150.12 11.195 39.222 25.933 23.517 31.732-3.946 24.16-60.403 30.766-81.503-19.33-190.228-45.26-65.235-16.27h-9.02v5.397l54.362 53.154 99.624 89.96 124.752 115.973 6.362 28.671-16.027 22.63-16.912-2.415-109.611-82.47-42.282-37.127-95.758-80.618h-6.363v8.456l22.067 32.296 116.537 175.167 6.04 53.719-8.456 17.476-30.201 10.55-33.181-6.04-68.215-95.758-70.39-107.84-56.778-96.644-6.926 3.947-33.503 360.886-15.705 18.443-36.243 13.852-30.201-22.953-16.027-37.127 16.027-73.37 19.329-95.758 15.704-76.107 14.175-94.55 8.456-31.41-.563-2.094-6.927.886-71.275 97.852-108.402 146.497-85.772 91.812-20.537 8.134-35.597-18.443 3.301-32.94 19.893-29.315 118.712-151.007 71.597-93.583 46.228-54.04-.322-7.813h-2.738l-315.302 204.725-56.135 7.248-24.16-22.63 2.98-37.128 11.435-12.08 94.792-65.236-.322.323z" fill="#d97757"/>
  </g>
  <text x="676" y="298" font-size="14" fill="#000000">Anthropic</text>
  <text x="676" y="318" font-size="11" fill="#777777">Claude (model calls)</text>

  <!-- arrow proxy -> anthropic -->
  <path d="M530 303H594" stroke="#000000" stroke-opacity="0.45" stroke-width="1.6"/>
  <path d="M594 303l-7 -4v8z" fill="#000000" fill-opacity="0.45"/>

  <text x="32" y="392" font-size="11.5" fill="#999999">Every signup = one dedicated, always-on VM + a 10 GB volume. Multiply by 10K+ signups/day.</text>
</svg>
