  <rect width="900" height="220" rx="16" fill="#fbf9f6"/>
  <rect x="0.5" y="0.5" width="899" height="219" rx="16" fill="none" stroke="rgba(0,0,0,0.1)"/>

  <text x="32" y="40" font-size="13" letter-spacing="2" fill="#777777">EACH USER CONNECTS THEIR OWN ACCOUNTS  ->  THE AGENT ACTS AS THEM</text>

