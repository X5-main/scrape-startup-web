  <text x="164" y="134" font-size="11" fill="#777777">fetch, draft, reply, send</text>
  <text x="164" y="152" font-size="10.5" fill="#999999">GMAIL_FETCH_EMAILS / GMAIL_SEND_EMAIL</text>

