<svg width="900" height="560" viewBox="0 0 900 560" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="'SF Mono','IBM Plex Mono',ui-monospace,monospace">
  <rect width="900" height="560" rx="16" fill="#fbf9f6"/>
  <rect x="0.5" y="0.5" width="899" height="559" rx="16" fill="none" stroke="rgba(0,0,0,0.1)"/>

  <text x="32" y="42" font-size="13" letter-spacing="2" fill="#777777">PER-USER IDENTITY + EXECUTION-TIME AUTHORITY INSIDE A MODEL-DRIVEN LOOP</text>

  <!-- Your backend -->
  <rect x="32" y="64" width="206" height="120" rx="10" fill="#efedeb" stroke="rgba(0,0,0,0.12)"/>
  <text x="135" y="96" font-size="14" fill="#000000" text-anchor="middle">Your SaaS backend</text>
  <text x="135" y="120" font-size="11" fill="#777777" text-anchor="middle">OpenRouter tool-use loop</text>
  <text x="135" y="140" font-size="11" fill="#777777" text-anchor="middle">naive.llm.chat({ tools })</text>
  <text x="135" y="160" font-size="11" fill="#777777" text-anchor="middle">one key  nv_sk_... (server)</text>

  <path d="M238 124H276" stroke="#000" stroke-opacity="0.45" stroke-width="1.6"/>
  <path d="M276 124l-7 -4v8z" fill="#000" fill-opacity="0.45"/>

  <!-- per-user identity -->
  <rect x="280" y="62" width="280" height="124" rx="12" fill="#ffffff" stroke="rgba(0,0,0,0.16)"/>
  <text x="300" y="90" font-size="14" fill="#000000">User = your end-user</text>
  <text x="300" y="112" font-size="11" fill="#777777">naive.forUser(userId)</text>
  <rect x="300" y="126" width="240" height="44" rx="7" fill="#eef3ee" stroke="#bcd3bc"/>
  <text x="316" y="146" font-size="11" fill="#3c6b3c">governed by Account Kit</text>
  <text x="316" y="162" font-size="11" fill="#3c6b3c">(plan tier: Free / Pro)</text>

  <path d="M560 124H598" stroke="#000" stroke-opacity="0.45" stroke-width="1.6"/>
  <path d="M598 124l-7 -4v8z" fill="#000" fill-opacity="0.45"/>

  <!-- enforcement gate -->
  <rect x="602" y="62" width="266" height="124" rx="12" fill="#ffffff" stroke="rgba(0,0,0,0.16)"/>
  <text x="618" y="90" font-size="14" fill="#000000">Naive enforcement</text>
  <text x="618" y="110" font-size="10.5" fill="#777777">runs when the agent acts</text>
  <rect x="618" y="120" width="234" height="22" rx="6" fill="#f6eeee" stroke="#d9b8b8"/>
  <text x="630" y="135" font-size="10" fill="#9a3b3b">execute disallowed tool -> forbidden</text>
  <rect x="618" y="148" width="234" height="22" rx="6" fill="#f6f1e6" stroke="#d8c79a"/>
  <text x="630" y="163" font-size="10" fill="#8a6d1f">connect new app -> 202 approval</text>

  <!-- the loop band -->
  <text x="32" y="226" font-size="12" letter-spacing="1" fill="#999999">THE LOOP    each turn, the model chooses tools; Naive runs only the ones the kit allows</text>

  <rect x="32" y="242" width="836" height="120" rx="12" fill="#ffffff" stroke="rgba(0,0,0,0.12)"/>

  <rect x="52" y="262" width="180" height="80" rx="9" fill="#f3f1ee" stroke="rgba(0,0,0,0.12)"/>
  <text x="142" y="296" font-size="12" fill="#000" text-anchor="middle">1. model proposes</text>
  <text x="142" y="316" font-size="10.5" fill="#777" text-anchor="middle">message.tool_calls[]</text>

  <path d="M232 302H266" stroke="#000" stroke-opacity="0.4" stroke-width="1.5"/><path d="M266 302l-7 -4v8z" fill="#000" fill-opacity="0.4"/>

  <rect x="270" y="262" width="180" height="80" rx="9" fill="#f3f1ee" stroke="rgba(0,0,0,0.12)"/>
  <text x="360" y="296" font-size="12" fill="#000" text-anchor="middle">2. Naive gates + runs</text>
  <text x="360" y="316" font-size="10.5" fill="#777" text-anchor="middle">connections.execute()</text>

  <path d="M450 302H484" stroke="#000" stroke-opacity="0.4" stroke-width="1.5"/><path d="M484 302l-7 -4v8z" fill="#000" fill-opacity="0.4"/>

  <rect x="488" y="262" width="180" height="80" rx="9" fill="#f3f1ee" stroke="rgba(0,0,0,0.12)"/>
  <text x="578" y="296" font-size="12" fill="#000" text-anchor="middle">3. feed results back</text>
  <text x="578" y="316" font-size="10.5" fill="#777" text-anchor="middle">role:"tool" messages</text>

  <path d="M668 302H702" stroke="#000" stroke-opacity="0.4" stroke-width="1.5"/><path d="M702 302l-7 -4v8z" fill="#000" fill-opacity="0.4"/>

  <rect x="706" y="262" width="142" height="80" rx="9" fill="#eef3ee" stroke="#bcd3bc"/>
  <text x="777" y="296" font-size="12" fill="#3c6b3c" text-anchor="middle">4. repeat /</text>
  <text x="777" y="316" font-size="12" fill="#3c6b3c" text-anchor="middle">finish</text>

  <path d="M777 342 Q777 372 432 372 Q142 372 142 348" stroke="#000" stroke-opacity="0.3" stroke-width="1.4" stroke-dasharray="4 4" fill="none"/>

  <!-- apps + audit -->
  <text x="32" y="416" font-size="12" letter-spacing="1" fill="#999999">USER'S OWN CONNECTED ACCOUNTS</text>

  <rect x="32" y="430" width="406" height="58" rx="9" fill="#ffffff" stroke="rgba(0,0,0,0.12)"/>
  <text x="48" y="456" font-size="13" fill="#000">connections</text>
  <text x="48" y="474" font-size="10.5" fill="#777777">Gmail, Slack, 1,000+ apps  (per-user OAuth)</text>

  <rect x="456" y="430" width="412" height="58" rx="9" fill="#ffffff" stroke="rgba(0,0,0,0.12)"/>
  <text x="472" y="456" font-size="13" fill="#000">logs</text>
  <text x="472" y="474" font-size="10.5" fill="#777777">every tool call audited, scoped to this user</text>

  <text x="32" y="524" font-size="11" fill="#777777">The model picks the tools. The Account Kit, enforced server-side at execution time, decides which ones actually run.</text>
</svg>
