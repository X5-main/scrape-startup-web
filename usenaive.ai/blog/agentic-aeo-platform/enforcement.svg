<svg width="900" height="360" viewBox="0 0 900 360" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="'SF Mono','IBM Plex Mono',ui-monospace,monospace">
  <rect width="900" height="360" rx="16" fill="#fbf9f6"/>
  <rect x="0.5" y="0.5" width="899" height="359" rx="16" fill="none" stroke="rgba(0,0,0,0.1)"/>

  <text x="32" y="42" font-size="13" letter-spacing="2" fill="#777777">EXECUTION-TIME ENFORCEMENT  —  TWO GATES, BOTH SERVER-SIDE</text>

  <!-- Lane A: quota -->
  <text x="32" y="78" font-size="12" letter-spacing="1" fill="#999999">A / METERED CALL -> PLAN QUOTA</text>

  <rect x="32" y="92" width="206" height="62" rx="10" fill="#ffffff" stroke="rgba(0,0,0,0.12)"/>
  <text x="135" y="118" font-size="13" fill="#000" text-anchor="middle">agent: aeo / seo call</text>
  <text x="135" y="138" font-size="10.5" fill="#777777" text-anchor="middle">forUser(brand).aeo....</text>

  <path d="M238 123H286" stroke="#000" stroke-opacity="0.45" stroke-width="1.6"/>
  <path d="M286 123l-7 -4v8z" fill="#000" fill-opacity="0.45"/>

  <rect x="288" y="92" width="206" height="62" rx="10" fill="#f3f1ee" stroke="rgba(0,0,0,0.12)"/>
  <text x="391" y="118" font-size="13" fill="#000" text-anchor="middle">quota check</text>
  <text x="391" y="138" font-size="10.5" fill="#777777" text-anchor="middle">usage vs plan, server-side</text>

  <!-- branch under quota -->
  <path d="M494 110H560" stroke="#000" stroke-opacity="0.4" stroke-width="1.6"/>
  <path d="M560 110l-7 -4v8z" fill="#000" fill-opacity="0.4"/>
  <rect x="562" y="84" width="306" height="36" rx="8" fill="#eef3ee" stroke="#bcd3bc"/>
  <text x="578" y="107" font-size="11.5" fill="#3c6b3c">under quota -> executed, usage +1</text>

  <!-- branch over quota -->
  <path d="M494 138H560" stroke="#000" stroke-opacity="0.4" stroke-width="1.6"/>
  <path d="M560 138l-7 -4v8z" fill="#000" fill-opacity="0.4"/>
  <rect x="562" y="126" width="306" height="36" rx="8" fill="#fdeee9" stroke="#e7c3b5"/>
  <text x="578" y="149" font-size="11.5" fill="#b4582f">over quota -> 429 rate_limited (no usage)</text>

  <!-- divider -->
  <path d="M32 192H868" stroke="#000" stroke-opacity="0.08" stroke-width="1"/>

  <!-- Lane B: approval -->
  <text x="32" y="222" font-size="12" letter-spacing="1" fill="#999999">B / CONNECT CMS -> HUMAN APPROVAL (REPLAY)</text>

  <rect x="32" y="236" width="196" height="64" rx="10" fill="#ffffff" stroke="rgba(0,0,0,0.12)"/>
  <text x="130" y="262" font-size="12.5" fill="#000" text-anchor="middle">agent: connect</text>
  <text x="130" y="282" font-size="10.5" fill="#777777" text-anchor="middle">connections.connect("webflow")</text>

  <path d="M228 268H274" stroke="#000" stroke-opacity="0.45" stroke-width="1.6"/>
  <path d="M274 268l-7 -4v8z" fill="#000" fill-opacity="0.45"/>

  <rect x="276" y="236" width="180" height="64" rx="10" fill="#fdeee9" stroke="#e7c3b5"/>
  <text x="366" y="262" font-size="12.5" fill="#b4582f" text-anchor="middle">202 pending_approval</text>
  <text x="366" y="282" font-size="10.5" fill="#7a4a36" text-anchor="middle">frozen  —  nothing runs</text>

  <path d="M456 268H502" stroke="#000" stroke-opacity="0.45" stroke-width="1.6"/>
  <path d="M502 268l-7 -4v8z" fill="#000" fill-opacity="0.45"/>

  <rect x="504" y="236" width="160" height="64" rx="10" fill="#ffffff" stroke="rgba(0,0,0,0.12)"/>
  <text x="584" y="262" font-size="12.5" fill="#000" text-anchor="middle">human approves</text>
  <text x="584" y="282" font-size="10.5" fill="#777777" text-anchor="middle">approvals.approve(id)</text>

  <path d="M664 268H710" stroke="#000" stroke-opacity="0.45" stroke-width="1.6"/>
  <path d="M710 268l-7 -4v8z" fill="#000" fill-opacity="0.45"/>

  <rect x="712" y="236" width="156" height="64" rx="10" fill="#eef3ee" stroke="#bcd3bc"/>
  <text x="790" y="262" font-size="12.5" fill="#3c6b3c" text-anchor="middle">API replays</text>
  <text x="790" y="282" font-size="10.5" fill="#5b805b" text-anchor="middle">connection -> ACTIVE</text>

  <text x="32" y="334" font-size="11.5" fill="#999999">The gate lives in the API, not your UI. Flip a plan quota or an Account Kit rule and every tenant is re-governed  —  no deploy.</text>
</svg>
