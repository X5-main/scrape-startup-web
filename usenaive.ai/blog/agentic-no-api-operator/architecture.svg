  <text x="460" y="336" font-size="12.5" fill="#000000">Managed KMS</text>
  <text x="460" y="356" font-size="10" fill="#777777">GenerateDataKey / ReEncrypt</text>
  <text x="460" y="374" font-size="10" fill="#777777">EncryptionContext per tenant</text>
  <text x="460" y="392" font-size="9.5" fill="#999999">AES-256-GCM, DEK zeroized</text>

  <!-- arrow lane A -> SaaS -->
  <path d="M582 137C616 137 630 133 662 133" stroke="#000000" stroke-opacity="0.4" stroke-width="1.6" fill="none"/>
  <path d="M662 133l-8 -4 1 8z" fill="#000000" fill-opacity="0.4"/>
  <!-- arrow lane B -> portal -->
  <path d="M582 209C616 209 630 233 662 233" stroke="#000000" stroke-opacity="0.4" stroke-width="1.6" fill="none"/>
  <path d="M662 233l-8 -4 1 8z" fill="#000000" fill-opacity="0.4"/>

  <!-- SaaS target -->
  <rect x="662" y="98" width="214" height="74" rx="10" fill="#ffffff" stroke="rgba(0,0,0,0.12)"/>
  <text x="769" y="126" font-size="13" fill="#000000" text-anchor="middle">Raw-API-key SaaS</text>
  <text x="769" y="146" font-size="10.5" fill="#777777" text-anchor="middle">no OAuth, has API</text>
  <text x="769" y="162" font-size="10" fill="#999999" text-anchor="middle">your code + fetch()</text>

  <!-- Portal target -->
  <rect x="662" y="198" width="214" height="74" rx="10" fill="#ffffff" stroke="rgba(0,0,0,0.12)"/>
  <text x="769" y="226" font-size="13" fill="#000000" text-anchor="middle">No-API portal</text>
  <text x="769" y="246" font-size="10.5" fill="#777777" text-anchor="middle">login form only</text>
  <text x="769" y="262" font-size="10" fill="#999999" text-anchor="middle">browser signup / login</text>

  <text x="662" y="392" font-size="10.5" fill="#999999">One vault per customer. Model never sees a locked secret.</text>
</svg>
