<svg width="900" height="430" viewBox="0 0 900 430" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="'SF Mono','IBM Plex Mono',ui-monospace,monospace">
  <rect width="900" height="430" rx="16" fill="#fbf9f6"/>
  <rect x="0.5" y="0.5" width="899" height="429" rx="16" fill="none" stroke="rgba(0,0,0,0.1)"/>

  <text x="28" y="38" font-size="13" letter-spacing="2" fill="#777777">PER-USER CREDENTIAL CUSTODY</text>

  <!-- Customer -->
  <rect x="24" y="92" width="150" height="76" rx="10" fill="#efedeb" stroke="rgba(0,0,0,0.12)"/>
  <text x="99" y="122" font-size="14" fill="#000000" text-anchor="middle">Customer</text>
  <text x="99" y="140" font-size="10.5" fill="#777777" text-anchor="middle">tenant user</text>
  <text x="99" y="156" font-size="10" fill="#999999" text-anchor="middle">forUser(acme)</text>

  <!-- arrow customer -> kit -->
  <path d="M174 130H196" stroke="#000000" stroke-opacity="0.45" stroke-width="1.6"/>
  <path d="M196 130l-7 -4v8z" fill="#000000" fill-opacity="0.45"/>

  <!-- Account Kit gate -->
  <rect x="196" y="84" width="150" height="96" rx="10" fill="#ffffff" stroke="rgba(0,0,0,0.14)"/>
  <text x="271" y="110" font-size="13" fill="#000000" text-anchor="middle">Account Kit</text>
  <text x="271" y="132" font-size="10.5" fill="#2f7d4f" text-anchor="middle">vault: enabled</text>
  <text x="271" y="150" font-size="10.5" fill="#2f7d4f" text-anchor="middle">browser: enabled</text>
  <text x="271" y="168" font-size="10.5" fill="#b4582f" text-anchor="middle">signup: approval</text>

  <!-- arrow kit -> vault -->
  <path d="M346 130H370" stroke="#000000" stroke-opacity="0.45" stroke-width="1.6"/>
  <path d="M370 130l-7 -4v8z" fill="#000000" fill-opacity="0.45"/>

  <!-- Vault -->
  <rect x="370" y="66" width="230" height="216" rx="12" fill="#ffffff" stroke="rgba(0,0,0,0.16)"/>
  <text x="485" y="92" font-size="14" fill="#000000" text-anchor="middle">Credential Vault</text>

  <!-- lane A: revealable -->
  <rect x="388" y="106" width="194" height="62" rx="8" fill="#e9f3ec" stroke="#b5d3bf"/>
  <text x="400" y="128" font-size="11.5" fill="#000000">api_key (revealable)</text>
  <text x="400" y="148" font-size="10.5" fill="#2f7d4f">reveal() -&gt; value</text>
  <text x="400" y="162" font-size="9.5" fill="#777777">used by your code</text>

  <!-- lane B: locked -->
  <rect x="388" y="178" width="194" height="62" rx="8" fill="#fdeee9" stroke="#e7c3b5"/>
  <text x="400" y="200" font-size="11.5" fill="#000000">password (locked)</text>
  <text x="400" y="220" font-size="10.5" fill="#b4582f">reveal -&gt; forbidden</text>
  <text x="400" y="234" font-size="9.5" fill="#777777">used server-side only</text>

  <text x="485" y="266" font-size="9.5" fill="#999999" text-anchor="middle">envelope-encrypted per entry</text>

  <!-- arrow vault -> kms -->
  <path d="M485 282V306" stroke="#000000" stroke-opacity="0.4" stroke-width="1.6"/>
  <path d="M485 306l-4 -7h8z" fill="#000000" fill-opacity="0.4"/>

  <!-- KMS -->
  <rect x="370" y="308" width="230" height="96" rx="10" fill="#efedeb" stroke="rgba(0,0,0,0.12)"/>
