<svg width="880" height="360" viewBox="0 0 880 360" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="'SF Mono','IBM Plex Mono',ui-monospace,monospace">
  <rect width="880" height="360" rx="16" fill="#fbf9f6"/>
  <rect x="0.5" y="0.5" width="879" height="359" rx="16" fill="none" stroke="rgba(0,0,0,0.1)"/>

  <text x="32" y="40" font-size="13" letter-spacing="2" fill="#777777">TWO SURFACES, ONE CUSTODY LAYER</text>

  <!-- Revealable column -->
  <rect x="32" y="64" width="384" height="264" rx="12" fill="#ffffff" stroke="#b5d3bf"/>
  <rect x="32" y="64" width="384" height="40" rx="12" fill="#e9f3ec"/>
  <rect x="32" y="92" width="384" height="12" fill="#e9f3ec"/>
  <text x="52" y="90" font-size="14" fill="#2f7d4f">REVEALABLE</text>
  <text x="396" y="90" font-size="11" fill="#2f7d4f" text-anchor="end">kind: api_key</text>

  <text x="52" y="134" font-size="12" fill="#000000">vault.put("instantly.api_key", key)</text>
  <text x="52" y="160" font-size="12" fill="#000000">const { value } = vault.reveal(k)</text>
  <text x="52" y="186" font-size="12" fill="#000000">fetch(url, { Authorization: value })</text>

  <line x1="52" y1="206" x2="396" y2="206" stroke="rgba(0,0,0,0.08)"/>
  <text x="52" y="232" font-size="11" fill="#555555">- Your own code reads it back</text>
  <text x="52" y="254" font-size="11" fill="#555555">- reveal is POST (never in a URL)</text>
  <text x="52" y="276" font-size="11" fill="#555555">- list() masks the value</text>
  <text x="52" y="298" font-size="11" fill="#555555">- expires_at + rotate supported</text>

  <!-- Locked column -->
  <rect x="464" y="64" width="384" height="264" rx="12" fill="#ffffff" stroke="#e7c3b5"/>
  <rect x="464" y="64" width="384" height="40" rx="12" fill="#fdeee9"/>
  <rect x="464" y="92" width="384" height="12" fill="#fdeee9"/>
  <text x="484" y="90" font-size="14" fill="#b4582f">LOCKED (write-only)</text>
  <text x="828" y="90" font-size="11" fill="#b4582f" text-anchor="end">locked: true</text>

  <text x="484" y="134" font-size="12" fill="#000000">browser.signup({ service, url })</text>
  <text x="484" y="160" font-size="12" fill="#999999">  -&gt; vaults login:&lt;service&gt;</text>
  <text x="484" y="186" font-size="12" fill="#000000">browser.login({ service, url })</text>
  <text x="484" y="212" font-size="12" fill="#b4582f">vault.reveal(k) -&gt; forbidden</text>

  <line x1="484" y1="230" x2="828" y2="230" stroke="rgba(0,0,0,0.08)"/>
  <text x="484" y="252" font-size="11" fill="#555555">- Stored once, never revealed back</text>
  <text x="484" y="274" font-size="11" fill="#555555">- Filled server-side by Naïve</text>
  <text x="484" y="296" font-size="11" fill="#555555">- Never sent to the model</text>

  <text x="32" y="348" font-size="10.5" fill="#999999">Revealable = the agent USES and READS the secret. Locked = the agent USES it but can NEVER read it.</text>
</svg>
