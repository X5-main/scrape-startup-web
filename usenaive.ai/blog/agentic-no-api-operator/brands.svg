  <text x="360" y="208" font-size="12" fill="#000000" text-anchor="middle">KMS wrap</text>
  <text x="360" y="226" font-size="10" fill="#777777" text-anchor="middle">under CMK</text>

  <!-- arrow to wrapped dek -->
  <path d="M418 212H472" stroke="#000000" stroke-opacity="0.45" stroke-width="1.6"/>
  <path d="M472 212l-7 -4v8z" fill="#000000" fill-opacity="0.45"/>

  <!-- wrapped dek stored -->
  <rect x="472" y="176" width="182" height="72" rx="10" fill="#ffffff" stroke="rgba(0,0,0,0.14)"/>
  <text x="563" y="204" font-size="12.5" fill="#000000" text-anchor="middle">wrapped_dek (stored)</text>
  <text x="563" y="224" font-size="10" fill="#777777" text-anchor="middle">+ kek_id ; plaintext DEK</text>
  <text x="563" y="238" font-size="10" fill="#777777" text-anchor="middle">zeroized immediately</text>

  <!-- EncryptionContext band -->
  <rect x="704" y="70" width="144" height="178" rx="12" fill="#efedeb" stroke="rgba(0,0,0,0.12)"/>
  <text x="776" y="98" font-size="12.5" fill="#000000" text-anchor="middle">Encryption</text>
  <text x="776" y="116" font-size="12.5" fill="#000000" text-anchor="middle">Context</text>
  <text x="776" y="146" font-size="10.5" fill="#555555" text-anchor="middle">company_id</text>
  <text x="776" y="166" font-size="10.5" fill="#555555" text-anchor="middle">tenant_user_id</text>
  <text x="776" y="200" font-size="9.5" fill="#b4582f" text-anchor="middle">verified on</text>
  <text x="776" y="214" font-size="9.5" fill="#b4582f" text-anchor="middle">every decrypt</text>
  <text x="776" y="234" font-size="9" fill="#999999" text-anchor="middle">cross-tenant = fail</text>

  <text x="32" y="304" font-size="11" fill="#999999">A wrapped_dek stolen from one tenant's row cannot decrypt another tenant's data - even under the same CMK.</text>
</svg>
