<svg width="880" height="340" viewBox="0 0 880 340" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="'SF Mono','IBM Plex Mono',ui-monospace,monospace">
  <rect width="880" height="340" rx="16" fill="#fbf9f6"/>
  <rect x="0.5" y="0.5" width="879" height="339" rx="16" fill="none" stroke="rgba(0,0,0,0.1)"/>

  <text x="32" y="40" font-size="13" letter-spacing="2" fill="#777777">ENVELOPE ENCRYPTION, PER ENTRY</text>

  <!-- value -->
  <rect x="32" y="70" width="150" height="60" rx="10" fill="#efedeb" stroke="rgba(0,0,0,0.12)"/>
  <text x="107" y="97" font-size="13" fill="#000000" text-anchor="middle">value</text>
  <text x="107" y="116" font-size="10.5" fill="#777777" text-anchor="middle">plaintext secret</text>

  <!-- arrow AES -->
  <path d="M182 100H236" stroke="#000000" stroke-opacity="0.45" stroke-width="1.6"/>
  <path d="M236 100l-7 -4v8z" fill="#000000" fill-opacity="0.45"/>
  <text x="209" y="90" font-size="10" fill="#999999" text-anchor="middle">AES-256</text>
  <text x="209" y="118" font-size="10" fill="#999999" text-anchor="middle">GCM</text>

  <!-- ciphertext -->
  <rect x="236" y="70" width="182" height="60" rx="10" fill="#ffffff" stroke="rgba(0,0,0,0.14)"/>
  <text x="327" y="94" font-size="12.5" fill="#000000" text-anchor="middle">ciphertext (stored)</text>
  <text x="327" y="114" font-size="10" fill="#777777" text-anchor="middle">nonce(12) | tag(16) | ct</text>

  <!-- per-entry DEK -->
  <rect x="32" y="182" width="150" height="60" rx="10" fill="#e9f3ec" stroke="#b5d3bf"/>
  <text x="107" y="209" font-size="13" fill="#000000" text-anchor="middle">per-entry DEK</text>
  <text x="107" y="228" font-size="10" fill="#2f7d4f" text-anchor="middle">GenerateDataKey</text>

  <!-- arrow to KMS wrap -->
  <path d="M182 212H236" stroke="#000000" stroke-opacity="0.45" stroke-width="1.6"/>
  <path d="M236 212l-7 -4v8z" fill="#000000" fill-opacity="0.45"/>
  <text x="209" y="202" font-size="10" fill="#999999" text-anchor="middle">wrap</text>

  <!-- KMS box with AWS logo -->
  <rect x="236" y="176" width="182" height="72" rx="10" fill="#fff7ec" stroke="#f0d3a3"/>
  <g transform="translate(252,196) scale(1.7)"><path d="M6.763 10.036c0 .296.032.535.088.71.064.176.144.368.256.576.04.063.056.127.056.183 0 .08-.048.16-.152.24l-.503.335a.383.383 0 0 1-.208.072c-.08 0-.16-.04-.239-.112a2.47 2.47 0 0 1-.287-.375 6.18 6.18 0 0 1-.248-.471c-.622.734-1.405 1.101-2.347 1.101-.67 0-1.205-.191-1.596-.574-.391-.384-.59-.894-.59-1.533 0-.678.239-1.23.726-1.644.487-.415 1.133-.623 1.955-.623.272 0 .551.024.846.064.296.04.6.104.918.176v-.583c0-.607-.127-1.03-.375-1.277-.255-.248-.686-.367-1.3-.367-.28 0-.568.031-.863.103-.295.072-.583.16-.862.272a2.287 2.287 0 0 1-.28.104.488.488 0 0 1-.127.023c-.112 0-.168-.08-.168-.247v-.391c0-.128.016-.224.056-.28a.597.597 0 0 1 .224-.167c.279-.144.614-.264 1.005-.36a4.84 4.84 0 0 1 1.246-.151c.95 0 1.644.216 2.091.647.439.43.662 1.085.662 1.963v2.586zm-3.24 1.214c.263 0 .534-.048.822-.144.287-.096.543-.271.758-.51.128-.152.224-.32.272-.512.047-.191.08-.423.08-.694v-.335a6.66 6.66 0 0 0-.735-.136 6.02 6.02 0 0 0-.75-.048c-.535 0-.926.104-1.19.32-.263.215-.39.518-.39.917 0 .375.095.655.295.846.191.2.47.296.838.296zm6.41.862c-.144 0-.24-.024-.304-.08-.064-.048-.12-.16-.168-.311L7.586 5.55a1.398 1.398 0 0 1-.072-.32c0-.128.064-.2.191-.2h.783c.151 0 .255.025.31.08.065.048.113.16.16.312l1.342 5.284 1.245-5.284c.04-.16.088-.264.151-.312a.549.549 0 0 1 .32-.08h.638c.152 0 .256.025.32.08.063.048.12.16.151.312l1.261 5.348 1.381-5.348c.048-.16.104-.264.16-.312a.52.52 0 0 1 .311-.08h.743c.127 0 .2.065.2.2 0 .04-.009.08-.017.128a1.137 1.137 0 0 1-.056.2l-1.923 6.17c-.048.16-.104.263-.168.311a.51.51 0 0 1-.303.08h-.687c-.151 0-.255-.024-.32-.08-.063-.056-.119-.16-.15-.32l-1.238-5.148-1.23 5.14c-.04.16-.087.264-.15.32-.065.056-.177.08-.32.08zm10.256.215c-.415 0-.83-.048-1.229-.143-.399-.096-.71-.2-.918-.32-.128-.071-.215-.151-.247-.223a.563.563 0 0 1-.048-.224v-.407c0-.167.064-.247.183-.247.048 0 .096.008.144.024.048.016.12.048.2.08.271.12.566.215.878.279.319.064.63.096.95.096.502 0 .894-.088 1.165-.264a.86.86 0 0 0 .41