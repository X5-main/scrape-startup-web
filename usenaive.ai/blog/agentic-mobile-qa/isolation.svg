  <rect x="0" y="0" width="960" height="440" fill="#fbf9f6"/>
  <rect x="0" y="0" width="960" height="8" fill="#2f7d4f"/>
  <text x="40" y="52" font-size="22" font-weight="700" fill="#1f2937">Isolation is per-tenant, behind one operator key</text>
  <text x="40" y="76" font-size="14" fill="#6b7280">every device and task is recorded against (company, user)</text>

  <!-- operator -->
  <rect x="360" y="100" width="240" height="70" rx="12" fill="#ffffff" stroke="#bcdcc8" stroke-width="1.5"/>
  <text x="380" y="128" font-size="13" font-weight="700" fill="#2f7d4f">Naive API - Mobilerun key</text>
  <text x="380" y="152" font-size="12" fill="#6b7280">MOBILERUN_API_KEY (never exposed)</text>

  <!-- Acme -->
  <rect x="60" y="210" width="380" height="190" rx="14" fill="#eef3ee" stroke="#bcdcc8" stroke-width="1.5"/>
  <text x="82" y="240" font-size="14" font-weight="700" fill="#2f7d4f">forUser(acmeId).mobile</text>
  <use href="#ph" x="90" y="260"/>
  <use href="#ph" x="132" y="260"/>
  <use href="#ph" x="174" y="260"/>
  <text x="90" y="338" font-size="12" fill="#333">Acme's phones + tasks only</text>
  <text x="90" y="362" font-size="12" fill="#2f7d4f">sees Acme, and only Acme</text>
  <text x="90" y="384" font-size="12" fill="#6b7280">device.list / task.get scoped to caller</text>

  <!-- Beta -->
  <rect x="520" y="210" width="380" height="190" rx="14" fill="#eef3ee" stroke="#bcdcc8" stroke-width="1.5"/>
  <text x="542" y="240" font-size="14" font-weight="700" fill="#2f7d4f">forUser(betaId).mobile</text>
  <use href="#ph" x="550" y="260"/>
  <use href="#ph" x="592" y="260"/>
  <text x="550" y="338" font-size="12" fill="#333">Beta's phones + tasks only</text>
  <text x="550" y="362" font-size="12" fill="#9a3b3b">Beta -&gt; Acme's task id = not_found (404)</text>
  <text x="550" y="384" font-size="12" fill="#6b7280">account-global ops refused for sub-users</text>

