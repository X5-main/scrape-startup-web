<svg width="960" height="420" viewBox="0 0 960 420" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="'SF Mono','IBM Plex Mono',ui-monospace,monospace">
  <rect width="960" height="420" rx="16" fill="#fbf9f6"/>
  <rect x="0.5" y="0.5" width="959" height="419" rx="16" fill="none" stroke="rgba(0,0,0,0.1)"/>

  <text x="32" y="40" font-size="13" letter-spacing="2" fill="#777777">AI AGENT INFRASTRUCTURE — FOUR PRODUCT LAYERS</text>
  <text x="32" y="62" font-size="12" fill="#999999">Same governance gateway whether the loop is yours or hosted</text>

  <!-- Layer 1 Runtime -->
  <rect x="32" y="92" width="210" height="250" rx="12" fill="#ffffff" stroke="rgba(0,0,0,0.14)"/>
  <rect x="32" y="92" width="210" height="36" rx="12" fill="#efedeb"/>
  <rect x="32" y="110" width="210" height="18" fill="#efedeb"/>
  <text x="137" y="116" font-size="13" fill="#000000" text-anchor="middle" font-weight="600">1. Runtime</text>
  <text x="137" y="156" font-size="12" fill="#000000" text-anchor="middle">Where the loop runs</text>
  <text x="137" y="182" font-size="11" fill="#777777" text-anchor="middle">BYO: LangGraph,</text>
  <text x="137" y="198" font-size="11" fill="#777777" text-anchor="middle">Eve, AgentCore</text>
  <text x="137" y="222" font-size="11" fill="#777777" text-anchor="middle">or Naïve-hosted</text>
  <text x="137" y="238" font-size="11" fill="#777777" text-anchor="middle">microVMs</text>
  <text x="137" y="274" font-size="10.5" fill="#999999" text-anchor="middle">Lead path: keep</text>
  <text x="137" y="290" font-size="10.5" fill="#999999" text-anchor="middle">your harness</text>
  <text x="137" y="318" font-size="10" fill="#b4582f" text-anchor="middle">Missing — rewrite</text>
  <text x="137" y="332" font-size="10" fill="#b4582f" text-anchor="middle">just to get tools</text>

  <!-- arrow -->
  <path d="M242 217H270" stroke="#000000" stroke-opacity="0.4" stroke-width="1.6"/>
  <path d="M270 217l-7 -4v8z" fill="#000000" fill-opacity="0.4"/>

  <!-- Layer 2 Profile + primitives -->
  <rect x="272" y="92" width="210" height="250" rx="12" fill="#ffffff" stroke="rgba(0,0,0,0.14)"/>
  <rect x="272" y="92" width="210" height="36" rx="12" fill="#efedeb"/>
  <rect x="272" y="110" width="210" height="18" fill="#efedeb"/>
  <text x="377" y="116" font-size="13" fill="#000000" text-anchor="middle" font-weight="600">2. Profile + tools</text>
  <text x="377" y="156" font-size="12" fill="#000000" text-anchor="middle">Act in the world</text>
  <text x="377" y="182" font-size="11" fill="#777777" text-anchor="middle">forUser(id)</text>
  <text x="377" y="198" font-size="11" fill="#777777" text-anchor="middle">46 primitives</text>
  <text x="377" y="222" font-size="11" fill="#777777" text-anchor="middle">identity · money</text>
  <text x="377" y="238" font-size="11" fill="#777777" text-anchor="middle">comms · cloud</text>
  <text x="377" y="274" font-size="10.5" fill="#999999" text-anchor="middle">One profile per</text>
  <text x="377" y="290" font-size="10.5" fill="#999999" text-anchor="middle">tenant customer</text>
  <text x="377" y="318" font-size="10" fill="#b4582f" text-anchor="middle">Missing — chat only</text>
  <text x="377" y="332" font-size="10" fill="#b4582f" text-anchor="middle">or raw vendor keys</text>

  <!-- arrow -->
  <path d="M482 217H510" stroke="#000000" stroke-opacity="0.4" stroke-width="1.6"/>
  <path d="M510 217l-7 -4v8z" fill="#000000" fill-opacity="0.4"/>

  <!-- Layer 3 Orchestration -->
  <rect x="512" y="92" width="210" height="250" rx="12" fill="#ffffff" stroke="rgba(0,0,0,0.14)"/>
  <rect x="512" y="92" width="210" height="36" rx="12" fill="#efedeb"/>
  <rect x="512" y="110" width="210" height="18" fill="#efedeb"/>
  <text x="617" y="116" font-size="13" fill="#000000" text-anchor="middle" font-weight="600">3. Orchestration</text>
  <text x="617" y="156" font-size="12" fill="#000000" text-anchor="middle">Multi-step work</text>
  <text x="617" y="182" font-size="11" fill="#777777" text-anchor="middle">objectives · staff</text>
  <text x="617" y="198" font-size="11" fill="#777777" text-anchor="middle">tasks · cron</text>
  <text x="617" y="222" font-size="11" fill="#777777" text-anchor="middle">accountability</text>
  <text x="617" y="238" font-size="11" fill="#777777" text-anchor="middle">across agents</text>
  <text x="617" y="274" font-size="10.5" fill="#999999" text-anchor="middle">Optional until</text>
  <text x="617" y="290" font-size="10.5" fill="#999999" text-anchor="middle">fleet scale</text>
  <text x="617" y="318" font-size="10" fill="#b4582f" text-anchor="middle">Missing — one giant</text>
  <text x="617" y="332" font-size="10" fill="#b4582f" text-anchor="middle">agent, no chain</text>

  <!-- arrow -->
  <path d="M722 217H750" stroke="#000000" stroke-opacity="0.4" stroke-width="1.6"/>
  <path d="M750 217l-7 -4v8z" fill="#000000" fill-opacity="0.4"/>

  <!-- Layer 4 Governance -->
  <rect x="752" y="92" width="176" height="250" rx="12" fill="#f3f1ee" stroke="rgba(0,0,0,0.18)"/>
  <rect x="752" y="92" width="176" height="36" rx="12" fill="#e8e4dc"/>
  <rect x="752" y="110" width="176" height="18" fill="#e8e4dc"/>
  <text x="840" y="116" font-size="13" fill="#000000" text-anchor="middle" font-weight="600">4. Governance</text>
  <text x="840" y="156" font-size="12" fill="#000000" text-anchor="middle">At tool boundary</text>
  <text x="840" y="182" font-size="11" fill="#777777" text-anchor="middle">caps</text>
  <text x="840" y="198" font-size="11" fill="#777777" text-anchor="middle">approvals</text>
  <text x="840" y="214" font-size="11" fill="#777777" text-anchor="middle">audit</text>
  <text x="840" y="230" font-size="11" fill="#777777" text-anchor="middle">revoke</text>
  <text x="840" y="262" font-size="10.5" fill="#999999" text-anchor="middle">Account Kit +</text>
  <text x="840" y="278" font-size="10.5" fill="#999999" text-anchor="middle">gateway</text>
  <text x="840" y="310" font-size="10" fill="#b4582f" text-anchor="middle">Missing — policy</text>
  <text x="840" y="324" font-size="10" fill="#b4582f" text-anchor="middle">lives in prompts</text>

  <text x="32" y="386" font-size="11" fill="#777777">Cloud is a slice of layer 2 (apps, Postgres, compute, queues) — not the whole stack.</text>
  <text x="32" y="404" font-size="11" fill="#999999">usenaive.ai/blog/what-is-ai-agent-infrastructure</text>
</svg>
