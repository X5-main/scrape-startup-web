<svg width="960" height="380" viewBox="0 0 960 380" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="'SF Mono','IBM Plex Mono',ui-monospace,monospace">
  <rect width="960" height="380" rx="16" fill="#fbf9f6"/>
  <rect x="0.5" y="0.5" width="959" height="379" rx="16" fill="none" stroke="rgba(0,0,0,0.10)"/>
  <rect x="0" y="0" width="960" height="6" rx="3" fill="#2f7d4f"/>

  <text x="28" y="46" font-size="13" letter-spacing="2" fill="#6b6560">DETECT: ENUMERATE, THEN SCREEN</text>

  <!-- Candidates -->
  <rect x="24" y="96" width="232" height="196" rx="12" fill="#ffffff" stroke="rgba(0,0,0,0.14)"/>
  <text x="44" y="126" font-size="13" fill="#1c1a17">Lookalike candidates</text>
  <text x="44" y="150" font-size="10.5" fill="#999999">local code, free</text>
  <text x="44" y="178" font-size="11" fill="#6b6560">northwindledger.co</text>
  <text x="44" y="200" font-size="11" fill="#6b6560">norhtwindledger.com</text>
  <text x="44" y="222" font-size="11" fill="#6b6560">n0rthwindledger.com</text>
  <text x="44" y="244" font-size="11" fill="#6b6560">get-northwindledger.com</text>
  <text x="44" y="266" font-size="11" fill="#6b6560">northwindledger-login.com</text>

  <!-- Screen -->
  <rect x="330" y="150" width="200" height="88" rx="12" fill="#eef1f5" stroke="#c4cdd8"/>
  <text x="430" y="184" font-size="13" fill="#3a4a63" text-anchor="middle">Screen availability</text>
  <text x="430" y="206" font-size="10.5" fill="#5b6b84" text-anchor="middle">GET /v1/domains/search</text>
  <text x="430" y="224" font-size="10.5" fill="#8a97a8" text-anchor="middle">available? price?</text>

  <!-- Available pile -->
  <rect x="604" y="96" width="332" height="88" rx="12" fill="#eef3ee" stroke="#bcdcc8"/>
  <text x="624" y="126" font-size="13" fill="#2f7d4f">Available</text>
  <text x="624" y="148" font-size="11" fill="#2f7d4f">a squatter could grab it next</text>
  <text x="624" y="168" font-size="11" fill="#5a9a73">rank by risk -&gt; register defensively (gated)</text>

  <!-- Taken pile -->
  <rect x="604" y="204" width="332" height="88" rx="12" fill="#faf1ea" stroke="#e7c9b0"/>
  <text x="624" y="234" font-size="13" fill="#b4582f">Taken</text>
  <text x="624" y="256" font-size="11" fill="#b4582f">someone already owns it</text>
  <text x="624" y="276" font-size="11" fill="#c78a63">investigate live site -&gt; web search</text>

  <!-- arrows -->
  <path d="M256 194H324" stroke="#1c1a17" stroke-opacity="0.4" stroke-width="1.6"/>
  <path d="M324 194l-8 -4v8z" fill="#1c1a17" fill-opacity="0.4"/>

  <path d="M530 176C566 176 566 140 598 140" stroke="#2f7d4f" stroke-opacity="0.6" stroke-width="1.6" fill="none"/>
  <path d="M598 140l-8 -4v8z" fill="#2f7d4f" fill-opacity="0.6"/>
  <path d="M530 212C566 212 566 248 598 248" stroke="#b4582f" stroke-opacity="0.6" stroke-width="1.6" fill="none"/>
  <path d="M598 248l-8 -4v8z" fill="#b4582f" fill-opacity="0.6"/>

  <text x="28" y="342" font-size="11.5" fill="#999999">Enumeration and screening cost nothing sensitive - no credentials, no spend, just strings and a lookup.</text>
</svg>
