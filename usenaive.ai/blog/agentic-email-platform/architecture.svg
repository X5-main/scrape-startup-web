<svg width="880" height="470" viewBox="0 0 880 470" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="'SF Mono','IBM Plex Mono',ui-monospace,monospace">
  <rect width="880" height="470" rx="16" fill="#fbf9f6"/>
  <rect x="0.5" y="0.5" width="879" height="469" rx="16" fill="none" stroke="rgba(0,0,0,0.1)"/>

  <text x="32" y="44" font-size="13" letter-spacing="2" fill="#777777">ONE CUSTOMER = ONE TENANT USER, GOVERNED BY A PLAN</text>

  <!-- Your SaaS backend -->
  <rect x="32" y="68" width="168" height="92" rx="10" fill="#efedeb" stroke="rgba(0,0,0,0.12)"/>
  <text x="116" y="98" font-size="14" fill="#000000" text-anchor="middle">Your SaaS</text>
  <text x="116" y="118" font-size="11" fill="#777777" text-anchor="middle">one workspace key</text>
  <text x="116" y="134" font-size="11" fill="#777777" text-anchor="middle">nv_sk_live_...</text>
  <text x="116" y="150" font-size="10.5" fill="#999999" text-anchor="middle">server-only</text>

  <!-- Stripe webhook -->
  <rect x="32" y="300" width="168" height="86" rx="10" fill="#ffffff" stroke="rgba(0,0,0,0.12)"/>
  <text x="116" y="328" font-size="13" fill="#000000" text-anchor="middle">Stripe webhook</text>
  <text x="116" y="348" font-size="11" fill="#777777" text-anchor="middle">checkout.session</text>
  <text x="116" y="364" font-size="11" fill="#777777" text-anchor="middle">→ setSubscription()</text>
  <text x="116" y="380" font-size="10.5" fill="#999999" text-anchor="middle">flips plan + Account Kit</text>

  <!-- Control plane: plans + kits -->
  <rect x="248" y="62" width="214" height="104" rx="10" fill="#ffffff" stroke="rgba(0,0,0,0.12)"/>
  <text x="355" y="90" font-size="14" fill="#000000" text-anchor="middle">Control plane</text>
  <text x="355" y="111" font-size="11" fill="#777777" text-anchor="middle">naive.plans.upsert()</text>
  <text x="355" y="127" font-size="11" fill="#777777" text-anchor="middle">naive.accountKits.create()</text>
  <text x="355" y="143" font-size="11" fill="#777777" text-anchor="middle">naive.users.create()</text>
  <text x="355" y="159" font-size="10.5" fill="#999999" text-anchor="middle">plan → kit → quotas</text>

  <!-- arrows: saas -> control plane -->
  <path d="M200 114H242" stroke="#000000" stroke-opacity="0.45" stroke-width="1.6"/>
  <path d="M242 114l-7 -4v8z" fill="#000000" fill-opacity="0.45"/>
  <!-- stripe webhook -> control plane (subscription) -->
  <path d="M200 343C224 343 224 200 246 168" stroke="#000000" stroke-opacity="0.4" stroke-width="1.6" fill="none"/>
  <path d="M246 168l1 8 6 -5z" fill="#000000" fill-opacity="0.4"/>

  <!-- Per-customer scoped runtime (stacked) -->
  <rect x="520" y="86" width="320" height="240" rx="12" fill="#efedeb" stroke="rgba(0,0,0,0.10)"/>
  <rect x="510" y="74" width="320" height="240" rx="12" fill="#f3f1ee" stroke="rgba(0,0,0,0.10)"/>
  <rect x="500" y="62" width="320" height="240" rx="12" fill="#ffffff" stroke="rgba(0,0,0,0.16)"/>

  <text x="516" y="88" font-size="13" fill="#000000">naive.forUser(customerId)</text>
  <text x="516" y="106" font-size="10.5" fill="#999999">scoped + Account-Kit gated</text>

  <!-- LLM box -->
  <rect x="516" y="120" width="288" height="50" rx="8" fill="#f4f2ef" stroke="rgba(0,0,0,0.10)"/>
  <text x="528" y="140" font-size="12" fill="#000000">.llm.chat()   drafts the campaign</text>
  <text x="528" y="158" font-size="10.5" fill="#777777">OpenRouter · 300+ models · billed in credits</text>

  <!-- Email box -->
  <rect x="516" y="178" width="288" height="52" rx="8" fill="#f4f2ef" stroke="rgba(0,0,0,0.10)"/>
  <text x="528" y="198" font-size="12" fill="#000000">.email.send({ from_inbox })</text>
  <text x="528" y="216" font-size="10.5" fill="#777777">sends from acme@you.usenaive.ai · 0.016 credits</text>

  <!-- Quota gate -->
  <rect x="516" y="238" width="288" height="50" rx="8" fill="#fdeee9" stroke="#e7c3b5"/>
  <text x="528" y="258" font-size="12" fill="#b4582f">metered vs plan quota</text>
  <text x="528" y="276" font-size="10.5" fill="#b4582f">over limit → 429 rate_limited (no send)</text>

  <!-- arrow control plane -> runtime -->
  <path d="M462 114H494" stroke="#000000" stroke-opacity="0.45" stroke-width="1.6"/>
  <path d="M494 114l-7 -4v8z" fill="#000000" fill-opacity="0.45"/>

  <text x="32" y="424" font-size="11.5" fill="#999999">The plan quota is enforced by the API at send time  not by your billing code, and not by a prompt the model can argue with.</text>
  <text x="32" y="446" font-size="11.5" fill="#999999">Customer A's agent can never read or send from Customer B's inbox: every call is scoped by forUser() and filtered by the kit.</text>
</svg>
