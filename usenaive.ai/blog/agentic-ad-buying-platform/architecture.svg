<svg width="960" height="440" viewBox="0 0 960 440" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="'SF Mono','IBM Plex Mono',ui-monospace,monospace">
  <rect width="960" height="440" rx="16" fill="#fbf9f6"/>
  <rect x="0.5" y="0.5" width="959" height="439" rx="16" fill="none" stroke="rgba(0,0,0,0.1)"/>

  <text x="28" y="38" font-size="13" letter-spacing="2" fill="#777777">ONE VIRTUAL CARD PER AGENT, ISSUER-ENFORCED CEILING</text>

  <!-- Client -->
  <rect x="24" y="108" width="150" height="84" rx="10" fill="#efedeb" stroke="rgba(0,0,0,0.12)"/>
  <text x="99" y="140" font-size="14" fill="#000000" text-anchor="middle">Client</text>
  <text x="99" y="159" font-size="10.5" fill="#777777" text-anchor="middle">tenant user</text>
  <text x="99" y="176" font-size="10" fill="#999999" text-anchor="middle">forUser(acme)</text>

  <!-- arrow client -> kit -->
  <path d="M174 150H198" stroke="#000000" stroke-opacity="0.45" stroke-width="1.6"/>
  <path d="M198 150l-7 -4v8z" fill="#000000" fill-opacity="0.45"/>

  <!-- Account Kit gate -->
  <rect x="198" y="100" width="158" height="100" rx="10" fill="#ffffff" stroke="rgba(0,0,0,0.14)"/>
  <text x="277" y="127" font-size="13" fill="#000000" text-anchor="middle">Account Kit</text>
  <text x="277" y="150" font-size="10.5" fill="#2f7d4f" text-anchor="middle">cards: enabled</text>
  <text x="277" y="168" font-size="10.5" fill="#b4582f" text-anchor="middle">issue: approval</text>
  <text x="277" y="186" font-size="10.5" fill="#b4582f" text-anchor="middle">top-up: approval</text>

  <!-- arrow kit -> card -->
  <path d="M356 150H382" stroke="#000000" stroke-opacity="0.45" stroke-width="1.6"/>
  <path d="M382 150l-7 -4v8z" fill="#000000" fill-opacity="0.45"/>

  <!-- Card -->
  <rect x="382" y="86" width="238" height="140" rx="12" fill="#ffffff" stroke="rgba(0,0,0,0.16)"/>
  <text x="501" y="112" font-size="14" fill="#000000" text-anchor="middle">Virtual card (managed)</text>
  <rect x="400" y="126" width="202" height="40" rx="8" fill="#eef1f6" stroke="#c8d2e2"/>
  <text x="412" y="144" font-size="10.5" fill="#000000">cardholder: KYC principal</text>
  <text x="412" y="159" font-size="9.5" fill="#777777">verified identity of record</text>
  <rect x="400" y="174" width="202" height="40" rx="8" fill="#e9f3ec" stroke="#b5d3bf"/>
  <text x="412" y="192" font-size="10.5" fill="#000000">spending_limit_cents</text>
  <text x="412" y="207" font-size="9.5" fill="#2f7d4f">hard ceiling on the card</text>

  <!-- arrow card -> agent -->
  <path d="M620 156H646" stroke="#000000" stroke-opacity="0.45" stroke-width="1.6"/>
  <path d="M646 156l-7 -4v8z" fill="#000000" fill-opacity="0.45"/>

  <!-- Assigned agent -->
  <rect x="646" y="112" width="150" height="88" rx="10" fill="#efedeb" stroke="rgba(0,0,0,0.12)"/>
  <text x="721" y="142" font-size="13" fill="#000000" text-anchor="middle">Assigned agent</text>
  <text x="721" y="162" font-size="10.5" fill="#777777" text-anchor="middle">one card, one agent</text>
  <text x="721" y="180" font-size="9.5" fill="#999999" text-anchor="middle">others: no credentials</text>

  <!-- arrow agent -> network (down) -->
  <path d="M721 200V232" stroke="#000000" stroke-opacity="0.45" stroke-width="1.6"/>
  <path d="M721 232l-4 -7h8z" fill="#000000" fill-opacity="0.45"/>

  <!-- Issuer network -->
  <rect x="560" y="248" width="330" height="72" rx="12" fill="#fff8ee" stroke="#e7d3ad"/>
  <text x="725" y="278" font-size="13" fill="#000000" text-anchor="middle">Visa / Mastercard network</text>
  <text x="725" y="299" font-size="10.5" fill="#8a6d2f" text-anchor="middle">authorizes swipe; over-ceiling = declined</text>

  <!-- arrow network -> merchant -->
  <path d="M560 284H534" stroke="#000000" stroke-opacity="0.45" stroke-width="1.6"/>
  <path d="M534 284l7 -4v8z" fill="#000000" fill-opacity="0.45"/>

  <!-- Merchant -->
  <rect x="382" y="248" width="152" height="72" rx="10" fill="#ffffff" stroke="rgba(0,0,0,0.14)"/>
  <text x="458" y="278" font-size="12.5" fill="#000000" text-anchor="middle">Ad network</text>
  <text x="458" y="298" font-size="9.5" fill="#777777" text-anchor="middle">any Visa merchant</text>

  <!-- Audit log -->
  <rect x="24" y="248" width="330" height="72" rx="12" fill="#f3eef6" stroke="#d8c5e2"/>
  <text x="189" y="278" font-size="13" fill="#000000" text-anchor="middle">Per-client audit log</text>
  <text x="189" y="299" font-size="10.5" fill="#6f4a86" text-anchor="middle">every charge logged + reconciled</text>

  <!-- arrow merchant -> log -->
  <path d="M382 284H358" stroke="#000000" stroke-opacity="0.35" stroke-width="1.4" stroke-dasharray="4 4"/>
  <path d="M358 284l7 -4v8z" fill="#000000" fill-opacity="0.35"/>

  <text x="28" y="358" font-size="11" fill="#999999">One operator key (nv_sk_...) provisions every client. Each card is scoped to one tenant user, one agent, one ceiling.</text>
  <text x="28" y="378" font-size="11" fill="#999999">Issuance and top-up freeze for a human; the spend ceiling is enforced by the card network, not by the prompt.</text>
</svg>
