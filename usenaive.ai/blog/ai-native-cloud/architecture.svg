<svg width="880" height="280" viewBox="0 0 880 280" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="'SF Mono','IBM Plex Mono',ui-monospace,monospace">
  <rect width="880" height="280" rx="16" fill="#fbf9f6"/>
  <rect x="0.5" y="0.5" width="879" height="279" rx="16" fill="none" stroke="rgba(0,0,0,0.1)"/>

  <text x="32" y="40" font-size="13" letter-spacing="2" fill="#777777">AI-NATIVE CLOUD — HOSTING SLICE UNDER ONE GOVERNED IDENTITY</text>

  <rect x="32" y="72" width="200" height="140" rx="10" fill="#ffffff" stroke="rgba(0,0,0,0.14)"/>
  <text x="132" y="104" font-size="13" fill="#000000" text-anchor="middle">Tenant user</text>
  <text x="132" y="126" font-size="11" fill="#777777" text-anchor="middle">forUser(id)</text>
  <text x="132" y="148" font-size="11" fill="#777777" text-anchor="middle">Account Kit</text>
  <text x="132" y="170" font-size="10.5" fill="#999999" text-anchor="middle">same identity as</text>
  <text x="132" y="186" font-size="10.5" fill="#999999" text-anchor="middle">cards / vault / email</text>

  <path d="M232 142H268" stroke="#000000" stroke-opacity="0.4" stroke-width="1.6"/>
  <path d="M268 142l-7 -4v8z" fill="#000000" fill-opacity="0.4"/>

  <rect x="270" y="72" width="360" height="140" rx="10" fill="#f3f1ee" stroke="rgba(0,0,0,0.16)"/>
  <text x="450" y="104" font-size="13" fill="#000000" text-anchor="middle">Cloud primitives (API)</text>
  <text x="330" y="136" font-size="11" fill="#777777">apps</text>
  <text x="390" y="136" font-size="11" fill="#777777">database</text>
  <text x="470" y="136" font-size="11" fill="#777777">storage</text>
  <text x="545" y="136" font-size="11" fill="#777777">auth</text>
  <text x="330" y="160" font-size="11" fill="#777777">functions</text>
  <text x="420" y="160" font-size="11" fill="#777777">compute</text>
  <text x="510" y="160" font-size="11" fill="#777777">queue</text>
  <text x="450" y="192" font-size="10.5" fill="#999999" text-anchor="middle">metered per call — no raw provider keys in prompt</text>

  <path d="M630 142H666" stroke="#000000" stroke-opacity="0.4" stroke-width="1.6"/>
  <path d="M666 142l-7 -4v8z" fill="#000000" fill-opacity="0.4"/>

  <rect x="668" y="72" width="180" height="140" rx="10" fill="#fdeee9" stroke="#e7c3b5"/>
  <text x="758" y="110" font-size="13" fill="#000000" text-anchor="middle">Governance</text>
  <text x="758" y="136" font-size="11" fill="#b4582f" text-anchor="middle">compute.create</text>
  <text x="758" y="154" font-size="11" fill="#b4582f" text-anchor="middle">→ pending_approval</text>
  <text x="758" y="180" font-size="10.5" fill="#999999" text-anchor="middle">HTTP 202 until</text>
  <text x="758" y="196" font-size="10.5" fill="#999999" text-anchor="middle">a human approves</text>

  <text x="32" y="250" font-size="11" fill="#777777">Parent category: AI agent infrastructure (profiles, primitives, orchestration, governance).</text>
  <text x="32" y="268" font-size="11" fill="#999999">Not a hyperscaler replacement — opinionated wrap of managed hosting.</text>
</svg>
