<svg width="880" height="430" viewBox="0 0 880 430" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="'SF Mono','IBM Plex Mono',ui-monospace,monospace">
  <rect width="880" height="430" rx="16" fill="#fbf9f6"/>
  <rect x="0.5" y="0.5" width="879" height="429" rx="16" fill="none" stroke="rgba(0,0,0,0.1)"/>

  <text x="32" y="44" font-size="13" letter-spacing="2" fill="#777777">EXECUTION-TIME PERMISSION  A TRADE IS FROZEN UNTIL A HUMAN APPROVES</text>

  <!-- lanes -->
  <text x="120" y="86" font-size="13" fill="#000000" text-anchor="middle">Agent</text>
  <text x="120" y="104" font-size="10.5" fill="#999999" text-anchor="middle">(your nv_sk_ key)</text>
  <line x1="120" y1="116" x2="120" y2="392" stroke="rgba(0,0,0,0.15)" stroke-dasharray="3 4"/>

  <text x="370" y="86" font-size="13" fill="#000000" text-anchor="middle">Naïve API</text>
  <text x="370" y="104" font-size="10.5" fill="#999999" text-anchor="middle">(/trading + Approvals)</text>
  <line x1="370" y1="116" x2="370" y2="392" stroke="rgba(0,0,0,0.15)" stroke-dasharray="3 4"/>

  <text x="620" y="86" font-size="13" fill="#000000" text-anchor="middle">Human</text>
  <text x="620" y="104" font-size="10.5" fill="#999999" text-anchor="middle">(client / operator)</text>
  <line x1="620" y1="116" x2="620" y2="392" stroke="rgba(0,0,0,0.15)" stroke-dasharray="3 4"/>

  <text x="800" y="86" font-size="13" fill="#000000" text-anchor="middle">Brokerage</text>
  <text x="800" y="104" font-size="10.5" fill="#999999" text-anchor="middle">(OAuth-linked)</text>
  <line x1="800" y1="116" x2="800" y2="392" stroke="rgba(0,0,0,0.15)" stroke-dasharray="3 4"/>

  <!-- 1: createOrder -->
  <path d="M120 150H366" stroke="#b4582f" stroke-opacity="0.8" stroke-width="1.6"/>
  <path d="M366 150l-7 -4v8z" fill="#b4582f" fill-opacity="0.8"/>
  <text x="130" y="142" font-size="11.5" fill="#b4582f">1 · createOrder({ symbol, notional, side })</text>

  <!-- 2: 202 frozen -->
  <path d="M370 190H124" stroke="#000000" stroke-opacity="0.5" stroke-width="1.6" stroke-dasharray="5 4"/>
  <path d="M124 190l7 -4v8z" fill="#000000" fill-opacity="0.5"/>
  <text x="130" y="182" font-size="11.5" fill="#555555">2 · 202 { status: "pending_approval", approval_id }</text>
  <rect x="300" y="200" width="140" height="22" rx="5" fill="#fdeee9" stroke="#e7c3b5"/>
  <text x="370" y="215" font-size="10.5" fill="#b4582f" text-anchor="middle">order NOT placed</text>

  <!-- 3: human notified -->
  <path d="M370 256H616" stroke="#000000" stroke-opacity="0.4" stroke-width="1.6"/>
  <path d="M616 256l-7 -4v8z" fill="#000000" fill-opacity="0.4"/>
  <text x="380" y="248" font-size="11.5" fill="#555555">3 · surfaced in Approvals queue</text>

  <!-- 4: approve -->
  <path d="M620 296H374" stroke="#2f6b35" stroke-opacity="0.8" stroke-width="1.6"/>
  <path d="M374 296l7 -4v8z" fill="#2f6b35" fill-opacity="0.8"/>
  <text x="380" y="288" font-size="11.5" fill="#2f6b35">4 · approvals.approve(approval_id)</text>

  <!-- 5: replay to brokerage -->
  <path d="M370 336H796" stroke="#000000" stroke-opacity="0.5" stroke-width="1.6"/>
  <path d="M796 336l-7 -4v8z" fill="#000000" fill-opacity="0.5"/>
  <text x="380" y="328" font-size="11.5" fill="#555555">5 · API replays the frozen order → broker fills</text>

  <!-- 6: executed back to agent -->
  <path d="M370 376H124" stroke="#2f6b35" stroke-opacity="0.6" stroke-width="1.6"/>
  <path d="M124 376l7 -4v8z" fill="#2f6b35" fill-opacity="0.6"/>
  <text x="130" y="368" font-size="11.5" fill="#2f6b35">6 · approval.status: "executed" + result</text>
</svg>
