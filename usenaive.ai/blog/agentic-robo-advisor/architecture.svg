<svg width="880" height="470" viewBox="0 0 880 470" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="'SF Mono','IBM Plex Mono',ui-monospace,monospace">
  <rect width="880" height="470" rx="16" fill="#fbf9f6"/>
  <rect x="0.5" y="0.5" width="879" height="469" rx="16" fill="none" stroke="rgba(0,0,0,0.1)"/>

  <text x="32" y="44" font-size="13" letter-spacing="2" fill="#777777">PER-CLIENT ISOLATION  ONE nv_sk_ KEY, SCOPED PER CLIENT</text>

  <!-- Your backend -->
  <rect x="32" y="70" width="168" height="80" rx="10" fill="#efedeb" stroke="rgba(0,0,0,0.12)"/>
  <text x="116" y="100" font-size="14" fill="#000000" text-anchor="middle">Your backend</text>
  <text x="116" y="120" font-size="11" fill="#777777" text-anchor="middle">holds one nv_sk_ key</text>
  <text x="116" y="136" font-size="11" fill="#777777" text-anchor="middle">never the browser</text>

  <!-- forUser scope -->
  <rect x="248" y="62" width="196" height="96" rx="10" fill="#ffffff" stroke="rgba(0,0,0,0.14)"/>
  <text x="346" y="90" font-size="13" fill="#000000" text-anchor="middle">naive.forUser(clientId)</text>
  <text x="346" y="110" font-size="11" fill="#777777" text-anchor="middle">do this, as this client,</text>
  <text x="346" y="126" font-size="11" fill="#777777" text-anchor="middle">under this client's policy</text>
  <rect x="266" y="134" width="160" height="16" rx="4" fill="#f3f1ee"/>
  <text x="346" y="146" font-size="10" fill="#999999" text-anchor="middle">Account Kit: Managed Portfolio</text>

  <!-- arrows backend -> scope -->
  <path d="M200 110H242" stroke="#000000" stroke-opacity="0.45" stroke-width="1.6"/>
  <path d="M242 110l-7 -4v8z" fill="#000000" fill-opacity="0.45"/>

  <!-- Reads box (ungated) -->
  <rect x="492" y="58" width="356" height="92" rx="10" fill="#eef5ee" stroke="#bcd8bc"/>
  <text x="510" y="84" font-size="13" fill="#2f6b35">READS  no approval</text>
  <text x="510" y="106" font-size="11.5" fill="#3c6b3c">trading.account() · positions() · quote()</text>
  <text x="510" y="126" font-size="11.5" fill="#3c6b3c">llm.chat()  →  propose a rebalance</text>
  <text x="510" y="143" font-size="10.5" fill="#6f9b6f">live brokerage state + market prices, then a target allocation</text>

  <!-- arrow scope -> reads -->
  <path d="M444 110H486" stroke="#000000" stroke-opacity="0.45" stroke-width="1.6"/>
  <path d="M486 110l-7 -4v8z" fill="#000000" fill-opacity="0.45"/>

  <!-- createOrder (sensitive) -->
  <rect x="248" y="214" width="196" height="84" rx="10" fill="#fdeee9" stroke="#e7c3b5"/>
  <text x="346" y="242" font-size="13" fill="#b4582f" text-anchor="middle">trading.createOrder()</text>
  <text x="346" y="262" font-size="11" fill="#b4582f" text-anchor="middle">SENSITIVE  money-moving</text>
  <text x="346" y="282" font-size="11" fill="#a76a4a" text-anchor="middle">place / cancel / close</text>

  <!-- arrow reads -> createOrder (decision flows down) -->
  <path d="M560 150C560 188 420 188 360 210" stroke="#000000" stroke-opacity="0.4" stroke-width="1.6" fill="none"/>
  <path d="M360 210l8 -1 -4 -7z" fill="#000000" fill-opacity="0.4"/>
  <text x="470" y="184" font-size="10.5" fill="#999999">agent decides → wants to trade</text>

  <!-- Approval gate -->
  <rect x="492" y="208" width="200" height="96" rx="10" fill="#ffffff" stroke="#e7c3b5"/>
  <text x="592" y="236" font-size="13" fill="#b4582f" text-anchor="middle">Approvals gate</text>
  <text x="592" y="256" font-size="11" fill="#777777" text-anchor="middle">202 pending_approval</text>
  <text x="592" y="274" font-size="11" fill="#777777" text-anchor="middle">human approve / deny</text>
  <text x="592" y="292" font-size="10.5" fill="#999999" text-anchor="middle">API replays on approval</text>

  <!-- arrow createOrder -> gate -->
  <path d="M444 256H486" stroke="#b4582f" stroke-opacity="0.7" stroke-width="1.6"/>
  <path d="M486 256l-7 -4v8z" fill="#b4582f" fill-opacity="0.7"/>

  <!-- Brokerage -->
  <rect x="724" y="208" width="124" height="96" rx="10" fill="#efedeb" stroke="rgba(0,0,0,0.12)"/>
  <text x="786" y="240" font-size="13" fill="#000000" text-anchor="middle">Brokerage</text>
  <text x="786" y="260" font-size="11" fill="#777777" text-anchor="middle">linked via OAuth</text>
  <text x="786" y="278" font-size="11" fill="#777777" text-anchor="middle">custodies + fills</text>
  <text x="786" y="294" font-size="10.5" fill="#999999" text-anchor="middle">stocks · crypto</text>

  <!-- arrow gate -> brokerage -->
  <path d="M692 256H718" stroke="#000000" stroke-opacity="0.45" stroke-width="1.6"/>
  <path d="M718 256l-7 -4v8z" fill="#000000" fill-opacity="0.45"/>
  <text x="640" y="200" font-size="10.5" fill="#999999">only after a human approves</text>

  <!-- Tenant lanes footer -->
  <rect x="32" y="346" width="816" height="78" rx="12" fill="#f3f1ee" stroke="rgba(0,0,0,0.08)"/>
  <text x="48" y="372" font-size="12" fill="#555555">forUser("client_a")</text>
  <text x="48" y="392" font-size="10.5" fill="#999999">own brokerage · own positions · own approvals</text>
  <line x1="300" y1="356" x2="300" y2="414" stroke="rgba(0,0,0,0.10)"/>
  <text x="316" y="372" font-size="12" fill="#555555">forUser("client_b")</text>
  <text x="316" y="392" font-size="10.5" fill="#999999">own brokerage · own positions · own approvals</text>
  <line x1="568" y1="356" x2="568" y2="414" stroke="rgba(0,0,0,0.10)"/>
  <text x="584" y="372" font-size="12" fill="#555555">forUser("client_c")</text>
  <text x="584" y="392" font-size="10.5" fill="#999999">own brokerage · own positions · own approvals</text>

  <text x="32" y="452" font-size="11.5" fill="#999999">Client A's scoped client can never read or trade Client B's account. Reads are free; every order is frozen until a human approves.</text>
</svg>
