<svg width="880" height="470" viewBox="0 0 880 470" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="'SF Mono','IBM Plex Mono',ui-monospace,monospace">
  <rect width="880" height="470" rx="16" fill="#fbf9f6"/>
  <rect x="0.5" y="0.5" width="879" height="469" rx="16" fill="none" stroke="rgba(0,0,0,0.1)"/>

  <text x="32" y="40" font-size="13" letter-spacing="2" fill="#777777">PER-FOUNDER ISOLATION</text>

  <!-- Founder signup -->
  <rect x="32" y="64" width="166" height="74" rx="10" fill="#efedeb" stroke="rgba(0,0,0,0.12)"/>
  <text x="115" y="94" font-size="14" fill="#000000" text-anchor="middle">Founder signs up</text>
  <text x="115" y="114" font-size="11" fill="#777777" text-anchor="middle">in your product</text>
  <text x="115" y="129" font-size="10.5" fill="#999999" text-anchor="middle">never signs into Naïve</text>

  <!-- Control plane -->
  <rect x="234" y="56" width="214" height="90" rx="10" fill="#ffffff" stroke="rgba(0,0,0,0.12)"/>
  <text x="341" y="84" font-size="14" fill="#000000" text-anchor="middle">Control plane (root key)</text>
  <text x="341" y="106" font-size="11" fill="#777777" text-anchor="middle">users.create() → tenant user</text>
  <text x="341" y="124" font-size="11" fill="#777777" text-anchor="middle">accountKits.assignUser()</text>
  <text x="341" y="140" font-size="10.5" fill="#999999" text-anchor="middle">"Incorporation" kit = policy</text>

  <!-- scoped client -->
  <rect x="484" y="56" width="200" height="90" rx="10" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="584" y="84" font-size="13.5" fill="#1e3a8a" text-anchor="middle">naive.forUser(founderId)</text>
  <text x="584" y="106" font-size="11" fill="#3730a3" text-anchor="middle">scoped agent client</text>
  <text x="584" y="124" font-size="10.5" fill="#6366f1" text-anchor="middle">isolated + kit-filtered</text>
  <text x="584" y="140" font-size="10.5" fill="#6366f1" text-anchor="middle">cannot touch other tenants</text>

  <!-- llm -->
  <rect x="712" y="64" width="136" height="74" rx="10" fill="#ffffff" stroke="rgba(0,0,0,0.12)"/>
  <text x="780" y="90" font-size="13" fill="#000000" text-anchor="middle">/llm</text>
  <text x="780" y="109" font-size="10.5" fill="#777777" text-anchor="middle">OpenRouter, 300+</text>
  <text x="780" y="124" font-size="10.5" fill="#777777" text-anchor="middle">names · NAICS · state</text>

  <!-- arrows row 1 -->
  <path d="M198 101H230" stroke="#000000" stroke-opacity="0.45" stroke-width="1.6"/>
  <path d="M230 101l-7 -4v8z" fill="#000000" fill-opacity="0.45"/>
  <path d="M448 101H480" stroke="#000000" stroke-opacity="0.45" stroke-width="1.6"/>
  <path d="M480 101l-7 -4v8z" fill="#000000" fill-opacity="0.45"/>
  <path d="M684 101H708" stroke="#000000" stroke-opacity="0.3" stroke-width="1.6" stroke-dasharray="3 3"/>

  <!-- identity stack label -->
  <text x="32" y="188" font-size="13" letter-spacing="2" fill="#777777">THE IDENTITY STACK - ONE SCOPED KEY</text>

  <!-- stages -->
  <!-- verification -->
  <rect x="32" y="206" width="186" height="120" rx="12" fill="#ffffff" stroke="rgba(0,0,0,0.16)"/>
  <text x="48" y="232" font-size="13.5" fill="#000000">1 · verification</text>
  <text x="48" y="252" font-size="10.5" fill="#555555">KYC every founder</text>
  <text x="48" y="268" font-size="10.5" fill="#555555">ID scan · selfie · SSN</text>
  <text x="48" y="284" font-size="10.5" fill="#555555">ready_for_formation</text>
  <rect x="48" y="294" width="154" height="22" rx="6" fill="#fdeee9" stroke="#e7c3b5"/>
  <text x="125" y="309" font-size="10" fill="#b4582f" text-anchor="middle">gated · verification.start</text>

  <!-- formation -->
  <rect x="238" y="206" width="186" height="120" rx="12" fill="#ffffff" stroke="rgba(0,0,0,0.16)"/>
  <text x="254" y="232" font-size="13.5" fill="#000000">2 · formation</text>
  <text x="254" y="252" font-size="10.5" fill="#555555">file the LLC ($349)</text>
  <text x="254" y="268" font-size="10.5" fill="#555555">submit → pay → execute</text>
  <text x="254" y="284" font-size="10.5" fill="#555555">Articles + EIN letter</text>
  <rect x="254" y="294" width="154" height="22" rx="6" fill="#fdeee9" stroke="#e7c3b5"/>
  <text x="331" y="309" font-size="10" fill="#b4582f" text-anchor="middle">gated · formation.submit</text>

  <!-- domains -->
  <rect x="444" y="206" width="186" height="120" rx="12" fill="#ffffff" stroke="rgba(0,0,0,0.16)"/>
  <text x="460" y="232" font-size="13.5" fill="#000000">3 · domains</text>
  <text x="460" y="252" font-size="10.5" fill="#555555">search + purchase</text>
  <text x="460" y="268" font-size="10.5" fill="#555555">DNS auto-configured</text>
  <text x="460" y="284" font-size="10.5" fill="#555555">SPF / DKIM / DMARC</text>
  <rect x="460" y="294" width="154" height="22" rx="6" fill="#fdeee9" stroke="#e7c3b5"/>
  <text x="537" y="309" font-size="10" fill="#b4582f" text-anchor="middle">gated · domains.purchase</text>

  <!-- email -->
  <rect x="650" y="206" width="198" height="120" rx="12" fill="#ffffff" stroke="rgba(0,0,0,0.16)"/>
  <text x="666" y="232" font-size="13.5" fill="#000000">4 · email</text>
  <text x="666" y="252" font-size="10.5" fill="#555555">inbox on the new domain</text>
  <text x="666" y="268" font-size="10.5" fill="#555555">founder@newco.com</text>
  <text x="666" y="284" font-size="10.5" fill="#555555">send + receive</text>
  <rect x="666" y="294" width="166" height="22" rx="6" fill="#eafaf0" stroke="#bfe6cd"/>
  <text x="749" y="309" font-size="10" fill="#2f8f5b" text-anchor="middle">live company, ready to run</text>

  <!-- flow arrows between stages -->
  <path d="M218 266H236" stroke="#000000" stroke-opacity="0.45" stroke-width="1.6"/>
  <path d="M236 266l-7 -4v8z" fill="#000000" fill-opacity="0.45"/>
  <path d="M424 266H442" stroke="#000000" stroke-opacity="0.45" stroke-width="1.6"/>
  <path d="M442 266l-7 -4v8z" fill="#000000" fill-opacity="0.45"/>
  <path d="M630 266H648" stroke="#000000" stroke-opacity="0.45" stroke-width="1.6"/>
  <path d="M648 266l-7 -4v8z" fill="#000000" fill-opacity="0.45"/>

  <!-- approval bar -->
  <rect x="32" y="350" width="404" height="86" rx="12" fill="#fff8f4" stroke="#e7c3b5"/>
  <text x="48" y="376" font-size="13" fill="#b4582f">Approvals queue - execution-time gate</text>
  <text x="48" y="397" font-size="10.5" fill="#9a5a3a">gated call → 202 pending_approval (not executed)</text>
  <text x="48" y="413" font-size="10.5" fill="#9a5a3a">human approves → API replays the frozen action</text>
  <text x="48" y="429" font-size="10.5" fill="#9a5a3a">agent can never raise its own authority</text>

  <!-- vault note -->
  <rect x="452" y="350" width="396" height="86" rx="12" fill="#f3f1ee" stroke="rgba(0,0,0,0.1)"/>
  <text x="468" y="376" font-size="13" fill="#000000">Encrypted identity vault</text>
  <text x="468" y="397" font-size="10.5" fill="#777777">SSN / DOB / address captured during KYC</text>
  <text x="468" y="413" font-size="10.5" fill="#777777">decrypted only at filing time, server-side</text>
  <text x="468" y="429" font-size="10.5" fill="#777777">never touches your database</text>
</svg>
