<svg width="880" height="430" viewBox="0 0 880 430" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="'SF Mono','IBM Plex Mono',ui-monospace,monospace">
  <rect width="880" height="430" rx="16" fill="#fbf9f6"/>
  <rect x="0.5" y="0.5" width="879" height="429" rx="16" fill="none" stroke="rgba(0,0,0,0.1)"/>

  <text x="32" y="40" font-size="13" letter-spacing="2" fill="#777777">THE IRREVERSIBLE FILING, FROZEN FOR A HUMAN</text>

  <!-- Agent attempt -->
  <rect x="32" y="70" width="200" height="70" rx="10" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="132" y="98" font-size="13" fill="#1e3a8a" text-anchor="middle">Agent calls</text>
  <text x="132" y="118" font-size="11" fill="#3730a3" text-anchor="middle">formation.execute(id)</text>
  <text x="132" y="133" font-size="10" fill="#6366f1" text-anchor="middle">the real state filing</text>

  <!-- 202 -->
  <rect x="284" y="70" width="200" height="70" rx="10" fill="#fff8f4" stroke="#e7c3b5"/>
  <text x="384" y="94" font-size="13" fill="#b4582f" text-anchor="middle">202 pending_approval</text>
  <text x="384" y="114" font-size="10.5" fill="#9a5a3a" text-anchor="middle">request frozen, NOT filed</text>
  <text x="384" y="130" font-size="10.5" fill="#9a5a3a" text-anchor="middle">returns approval_id</text>

  <!-- human -->
  <rect x="536" y="70" width="200" height="70" rx="10" fill="#ffffff" stroke="rgba(0,0,0,0.16)"/>
  <text x="636" y="98" font-size="13" fill="#000000" text-anchor="middle">Human reviews</text>
  <text x="636" y="118" font-size="10.5" fill="#777777" text-anchor="middle">operator or end-user</text>
  <text x="636" y="133" font-size="10.5" fill="#777777" text-anchor="middle">approves or denies</text>

  <!-- arrows top row -->
  <path d="M232 105H280" stroke="#000000" stroke-opacity="0.45" stroke-width="1.6"/>
  <path d="M280 105l-7 -4v8z" fill="#000000" fill-opacity="0.45"/>
  <path d="M484 105H532" stroke="#000000" stroke-opacity="0.45" stroke-width="1.6"/>
  <path d="M532 105l-7 -4v8z" fill="#000000" fill-opacity="0.45"/>

  <!-- branch down: deny -->
  <path d="M636 140V176H384V200" stroke="#b4582f" stroke-opacity="0.6" stroke-width="1.6" stroke-dasharray="4 3"/>
  <text x="650" y="166" font-size="10.5" fill="#b4582f">deny →</text>
  <rect x="284" y="200" width="200" height="56" rx="10" fill="#fdeee9" stroke="#e7c3b5"/>
  <text x="384" y="224" font-size="12.5" fill="#b4582f" text-anchor="middle">denied · nothing filed</text>
  <text x="384" y="242" font-size="10.5" fill="#9a5a3a" text-anchor="middle">no $349 spent, no entity</text>

  <!-- branch: approve -> replay -->
  <path d="M636 140V286H700" stroke="#2f8f5b" stroke-opacity="0.7" stroke-width="1.6"/>
  <path d="M700 286l-7 -4v8z" fill="#2f8f5b" fill-opacity="0.7"/>
  <text x="560" y="280" font-size="10.5" fill="#2f8f5b">approve →</text>

  <!-- replay -->
  <rect x="640" y="258" width="200" height="56" rx="10" fill="#eafaf0" stroke="#bfe6cd"/>
  <text x="740" y="282" font-size="12.5" fill="#2f8f5b" text-anchor="middle">API replays the call</text>
  <text x="740" y="300" font-size="10.5" fill="#2f8f5b" text-anchor="middle">PII decrypted at filing time</text>

  <!-- filed -->
  <rect x="32" y="330" width="200" height="66" rx="10" fill="#ffffff" stroke="rgba(0,0,0,0.16)"/>
  <text x="132" y="356" font-size="12.5" fill="#000000" text-anchor="middle">status: submitted</text>
  <text x="132" y="376" font-size="10.5" fill="#777777" text-anchor="middle">filing dispatched to state</text>
  <text x="132" y="390" font-size="10.5" fill="#777777" text-anchor="middle">formation_completed</text>

  <!-- docs -->
  <rect x="284" y="330" width="200" height="66" rx="10" fill="#f3f1ee" stroke="rgba(0,0,0,0.1)"/>
  <text x="384" y="356" font-size="12.5" fill="#000000" text-anchor="middle">documents ready</text>
  <text x="384" y="376" font-size="10.5" fill="#777777" text-anchor="middle">Articles of Organization</text>
  <text x="384" y="390" font-size="10.5" fill="#777777" text-anchor="middle">EIN assignment letter</text>

  <!-- replay -> filed -->
  <path d="M740 314V356H488" stroke="#2f8f5b" stroke-opacity="0.55" stroke-width="1.6"/>
  <path d="M236 363H488" stroke="#000000" stroke-opacity="0.0" stroke-width="0"/>
  <path d="M488 363H236" stroke="#000000" stroke-opacity="0.45" stroke-width="1.6"/>
  <path d="M236 363l7 -4v8z" fill="#000000" fill-opacity="0.45"/>

  <text x="512" y="386" font-size="10.5" fill="#999999">download via signed URLs (H1h)</text>
</svg>
