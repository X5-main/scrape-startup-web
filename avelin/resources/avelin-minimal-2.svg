<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="minimalBorderGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FFFF" />
      <stop offset="100%" stop-color="#BF00FF" />
    </linearGradient>
    <linearGradient id="minimalAGradient" x1="27" y1="50" x2="73" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00FFFF" />
      <stop offset="100%" stop-color="#BF00FF" />
    </linearGradient>
    <filter id="minimalGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <circle cx="50" cy="50" r="45" fill="none" stroke="url(#minimalBorderGradient)" stroke-width="2" filter="url(#minimalGlow)"/>
  <g filter="url(#minimalGlow)">
    <line x1="50" y1="23" x2="27" y2="63" stroke="url(#minimalAGradient)" stroke-width="2" stroke-linecap="round"/>
    <line x1="50" y1="23" x2="73" y2="63" stroke="url(#minimalAGradient)" stroke-width="2" stroke-linecap="round"/>
    <line x1="73" y1="63" x2="38.5" y2="43" stroke="url(#minimalAGradient)" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>