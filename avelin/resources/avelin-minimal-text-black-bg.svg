<svg width="195" height="60" viewBox="0 0 195 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="195" height="60" fill="#000000"/>
  <defs>
    <linearGradient id="minTextBorderGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FFFF" />
      <stop offset="100%" stop-color="#BF00FF" />
    </linearGradient>
    <linearGradient id="minTextAGradient" x1="13.5" y1="30" x2="36.5" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00FFFF" />
      <stop offset="100%" stop-color="#BF00FF" />
    </linearGradient>
    <linearGradient id="minTextWordGradient" x1="60" y1="30" x2="220" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00FFFF" />
      <stop offset="100%" stop-color="#BF00FF" />
    </linearGradient>
    <filter id="minTextGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g transform="translate(5, 5)">
    <circle cx="25" cy="25" r="23" fill="none" stroke="url(#minTextBorderGradient)" stroke-width="1.5" filter="url(#minTextGlow)"/>
    <g filter="url(#minTextGlow)">
      <line x1="25" y1="13" x2="13.5" y2="33" stroke="url(#minTextAGradient)" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="25" y1="13" x2="36.5" y2="33" stroke="url(#minTextAGradient)" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="36.5" y1="33" x2="19.25" y2="23" stroke="url(#minTextAGradient)" stroke-width="1.5" stroke-linecap="round"/>
    </g>
  </g>
  <g filter="url(#minTextGlow)">
    <text x="60" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="300" letter-spacing="8" fill="url(#minTextWordGradient)">AVELIN</text>
  </g>
</svg>